id: BUILT_IN_FURNITURE_ASA
name: งานเฟอร์นิเจอร์และตกแต่งภายใน (Furnitures - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: furnishings_furniture
masterformat: 12 50 00 - Furnitures
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 12 50 00
  tis: มอก. 178-2549 (แผ่นไม้อัด), มอก. 192-2549 (ไม้แปรรูป)
  dpt: มาตรฐานสมาคมมัณฑนากรแห่งประเทศไทย (TIDA)
general_properties:
- โครงสร้างไม้จริง (ไม้สัก ไม้ยางพารา) อบแห้ง ไสเรียบ ปราศจากรอยแตกร้าว บิดงอ ตาไม้ผุ
  ผ่านการอัดน้ำยากันปลวก
- ไม้อัดสักและไม้อัดยาง หนา 4 มม., 6 มม., 10 มม. เกรด A ลายสวยงาม ไม่บวมพอง หรือแยกชั้น
- แผ่นพลาสติกลามิเนต (HPL) หนาไม่น้อยกว่า 0.8 มม. ลวดลายและสีตามแบบ ไม่แตกลายงา
- แผ่นสแตนเลส SUS 304 หนาไม่น้อยกว่า 1.0 มม. ผิวเรียบ Hairline หรือ Mirror
- อุปกรณ์ฟิตติ้ง (Hardware Fittings): รางลิ้นชักลูกปืน บานพับถ้วย Soft-Close มือจับ
    และกุญแจ ทำจากโลหะชุบกันสนิมหรือสแตนเลส
surface_preparation:
- ตรวจสอบระยะพื้นที่หน้างานจริง แนวผนัง พื้น และเพดาน ทั้งแนวดิ่ง ระดับ และฉาก
- ประสานงานตำแหน่งปลั๊กไฟฟ้า สวิตช์ ช่องท่อร้อยสายไฟ และหัวจ่ายแอร์ที่เกี่ยวข้องกับตัวเฟอร์นิเจอร์
- จัดทำ Shop Drawing รายละเอียดการประกอบ การเข้าเดือย การแบ่งช่อง และตัวอย่างวัสดุผิวสัมผัสเพื่อขออนุมัติ
application_system:
- ประกอบโครงไม้ด้วยการเข้าเดือยและทากาวลาเท็กซ์สำหรับงานไม้ ยึดด้วยสกรูเกลียวซ่อนหัว
  โครงห่างไม่เกิน 400 มม.
- กรุผิวไม้อัดด้วยกาวและยิงตะปูยึดซ่อนหัว อัดแนวต่อจนกาวแห้งสนิท ขัดผิวด้วยกระดาษทรายให้เรียบเนียน
- การติดลามิเนต: ทากาวยางทั้งสองหน้า รีดประกบแน่นด้วยลูกกลิ้ง ไล่ฟองอากาศไม่ให้บวมพอง
    แต่งขอบลบคมด้วยเราเตอร์
- ติดตั้งเฟอร์นิเจอร์เข้ากับผนังหรือพื้นด้วยโครงซ่อนและพุกสกรูที่มั่นคงแข็งแรง ปิดรอยต่อชนผนังด้วยซิลิโคนหรือบัวไม้
- ติดตั้งหน้าบาน ลิ้นชัก ปรับตั้งบานพับและรางเลื่อนให้เปิด-ปิดได้ระนาบ นุ่มนวล เที่ยงตรง
  พร้อมทำความสะอาดส่งมอบ
