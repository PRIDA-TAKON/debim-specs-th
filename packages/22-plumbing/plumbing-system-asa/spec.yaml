id: PLUMBING_SYSTEM_ASA
name: งานระบบท่อสุขาภิบาล (Plumbing System - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตท่อมาตรฐาน มอก.
category: plumbing_system
masterformat: 22 00 00 - Plumbing
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 22 00 00
  tis: มอก. 17-2532 (ท่อพีวีซีแข็ง), มอก. 277-2532 (ท่อเหล็กอาบสังกะสี), มอก. 249-2540
    (ข้อต่อเหล็กหล่อเหนียว), มอก. 343-2523 (ก๊อกน้ำ)
  dpt: มาตรฐาน วสท. 3001-44
general_properties:
- ท่อน้ำประปาภายใน: ท่อเหล็กอาบสังกะสี มอก. 277 Class 2 หรือท่อ PP-R / HDPE PN10 สำหรับท่อฝังดิน
    และท่อน้ำร้อนใช้ท่อทองแดง Type L หุ้มฉนวน
- ท่อน้ำเสียและท่อน้ำทิ้ง: ท่อ PVC แข็ง มอก. 17-2532 ชั้นคุณภาพ 8.5 (ภายในอาคาร) และชั้นคุณภาพ
    13.5 (ภายนอกอาคารและท่อฝังดิน)
- ท่อระบายอากาศ (Vent Pipe) และท่อระบายน้ำฝน: ท่อ PVC ชั้น 8.5 คุณภาพมาตรฐาน
- วาล์วน้ำ: ประตูน้ำทองเหลือง (Gate Valve), โกลบวาล์ว (Globe Valve) และเช็ควาล์ว (Check
    Valve) ทนแรงดันไม่น้อยกว่า 125 psi (8.79 kg/cm²)
- อุปกรณ์รองรับท่อ: แฮงเกอร์เหล็กชุบกัลวาไนซ์ ประกับรัดท่อ และสลักเกลียวยึดโครงสร้าง
surface_preparation:
- จัดทำแบบ Shop Drawing ประสานแนวท่อรวม (Combine Shop Drawing) ร่วมกับระบบไฟฟ้าและปรับอากาศ
- ติดตั้งปลอกท่อ (Sleeve) ขนาดโตกว่าท่อไม่น้อยกว่า 10-15 มม. ก่อนการเทคอนกรีตพื้น
  คาน และผนัง
- ตรวจสอบแนวระดับ ความลาดเอียงของท่อน้ำทิ้ง-น้ำเสีย ต้องมีความลาดเอียงไม่น้อยกว่า
  1:50 (20 มม./ม.)
- ขุดร่องดินสำหรับท่อฝังดิน ก้นร่องต้องกระทุ้งดินให้แน่นสม่ำเสมอ หรือรองด้วยทรายหยาบอัดแน่น
application_system:
- ตัดท่อด้วยเครื่องตัดท่อ ลบเหลี่ยมคม คว้านปากท่อ และทำความสะอาดก่อนทาน้ำยาประสานท่อหรือต๊าปเกลียว
- ต่อท่อเกลียวด้วยเทปพันเกลียว PTFE ขันแน่นเหลือเกลียวไม่เกิน 2 เกลียว ท่อ PVC ใช้น้ำยาประสานท่อตามมาตรฐานผู้ผลิต
- ติดตั้งท่อแขวนใต้ท้องพื้นด้วยเหล็กรัดท่อและแฮงเกอร์ปรับระดับ ทุกระยะห่าง 1.50-2.00
  ม. ให้ได้แนวตรงและลาดเอียงสม่ำเสมอ
- ท่อลอดถนนต้องเทหุ้มด้วยคอนกรีตหนาไม่น้อยกว่า 100 มม. เพื่อป้องกันความเสียหายจากแรงกดทับ
- ท่อระบายอากาศต้องเดินตั้งตรงและยื่นพ้นระดับหลังคาอาคารไม่น้อยกว่า 300 มม.
- การทดสอบแรงดันน้ำประปา: อัดแรงดันน้ำ 100 psi (7.03 kg/cm²) ต่อเนื่องไม่น้อยกว่า
    30 นาที ตรวจสอบไม่มีการรั่วซึม
- การทดสอบท่อน้ำทิ้งและท่ออากาศ: ทดสอบด้วยการขังน้ำเต็มท่อถึงยอดท่ออากาศนาน 30 นาที
    ระดับน้ำลดลงไม่เกิน 100 มม.
