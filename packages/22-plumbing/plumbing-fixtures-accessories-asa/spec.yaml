id: PLUMBING_FIXTURES_AND_ACCESSORIES_ASA
name: งานสุขภัณฑ์และอุปกรณ์ประกอบห้องน้ำ (Plumbing Fixtures and Bath Accessories -
  ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตสุขภัณฑ์มาตรฐาน มอก.
category: plumbing_fixtures
masterformat: 22 40 00 - Plumbing Fixtures
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 22 40 00, 10 28
    13 และ 10 28 16
  tis: มอก. 792-2554 (เครื่องสุขภัณฑ์เซรามิก), มอก. 2066-2552 (ก๊อกน้ำสำหรับเครื่องสุขภัณฑ์)
  dpt: มาตรฐาน วสท. 3001-44, ASME A112.19.2
general_properties:
- โถส้วม อ่างล้างหน้า โถปัสสาวะชาย เซรามิกวิเทรียสไชน่า (Vitreous China) สีขาว ผิวเคลือบเรียบเนียน
  เคลือบสารยับยั้งแบคทีเรีย ปราศจากรอยแตกร้าวหรือตำหนิ
- ก๊อกน้ำ สายฉีดชำระ วาล์วสต็อป (Stop Valve) และสะดืออ่าง ทำจากทองเหลืองชุบโครเมียมเงางามหรือสแตนเลส
  SUS 304 ปลอดภัยจากสารตะกั่ว
- ตะแกรงระบายน้ำทิ้งที่พื้น (Floor Drain) สแตนเลส ขนาดท่อไม่เล็กกว่า Dia 75 มม. (3
  นิ้ว) พร้อมถ้วยดักกลิ่นและกันแมลงในตัว
- ผนังห้องน้ำสำเร็จรูป ชนิดลามิเนตแรงดันสูง (HPL) หรือ Polyester Resin Finished หนา
  25 มม. พร้อมอุปกรณ์ฟิตติ้งสแตนเลสครบชุด
- กระจกเงาติดผนังหนา 6 มม. เจียรริมรอบด้าน ยึดด้วยหมุดสแตนเลส 4 มุม พร้อมที่ใส่กระดาษชำระ
  ที่ใส่สบู่ และราวมือจับสแตนเลส
surface_preparation:
- ตรวจสอบตำแหน่งท่อน้ำดี ท่อน้ำทิ้ง และท่อโสโครกที่พื้นและผนังให้ตรงตามระยะติดตั้งสุขภัณฑ์แต่ละรุ่น
  (Rough-in Dimensions)
- งานปูกระเบื้องพื้นและผนังห้องน้ำต้องแล้วเสร็จสมบูรณ์ ยาแนวแห้งสนิท และทำความสะอาดเรียบร้อย
- จัดทำ Shop Drawing แสดงการจัดวางสุขภัณฑ์ ระยะความสูง และแนวรอยต่อกระเบื้องเพื่อขออนุมัติ
application_system:
- ติดตั้งโถส้วมเข้ากับท่อโสโครกด้วยปะเก็นขี้ผึ้ง (Wax Ring) หรือหน้าแปลนกันกลิ่น ป้องกันกลิ่นย้อนอย่างเด็ดขาด
  ยึดโบลท์ลงพื้นมั่นคงและยาแนวขอบด้วยซิลิโคนกันเชื้อรา
- ติดตั้งอ่างล้างหน้าและโถปัสสาวะด้วยพุกเหล็กและขารับที่แข็งแรง ได้ระดับแนวนอนตามเกณฑ์สถาปัตยกรรม
- ติดตั้ง Stop Valve แยกอิสระสำหรับอุปกรณ์ทุกชิ้น เพื่อความสะดวกในการซ่อมบำรุง
- ติดตั้ง Floor Drain ให้เสมอหรือต่ำกว่าระดับกระเบื้องเล็กน้อย ปาดผิวปูนทรายให้ลาดเทสู่น้ำทิ้ง
- ทดสอบการใช้งานสุขภัณฑ์ทุกชิ้น การระบายน้ำ การทำงานของวาล์วชำระ และตรวจเช็คการรั่วซึมทุกจุด
  ห่อหุ้มด้วยพลาสติกใสปกป้องจนส่งมอบงาน
