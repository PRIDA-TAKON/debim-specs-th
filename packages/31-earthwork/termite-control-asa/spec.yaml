id: TERMITE_CONTROL_ASA
name: งานระบบป้องกันและกำจัดปลวก (Termite Control - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ให้บริการที่ได้รับใบอนุญาตจาก อย.
category: earthwork_termite_control
masterformat: 31 31 16 - Termite Control
warranty_years: 3
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 31 31 16
  tis: มาตรฐานสำนักงานคณะกรรมการอาหารและยา (อย.) กระทรวงสาธารณสุข
  dpt: มาตรฐานกรมวิทยาศาสตร์การแพทย์ กระทรวงสาธารณสุข
general_properties:
- ระบบท่อกำจัดปลวก (Pipe Treatment System): ท่อ PVC คุณภาพสูง ชั้นความหนา 13.5 ขนาดเส้นผ่านศูนย์กลาง
    12.5 มม. (1/2 นิ้ว) ทนแรงดันสารเคมีได้ดี
- หัวสปริงเกลอร์ฉีดน้ำยา (Sprinkler Nozzle) และข้อต่อ PVC ชั้น 13.5 ยึดด้วยแคล้มป์รัดท่อสแตนเลสและพุกพลาสติกทุกระยะไม่เกิน
  800 มม.
- สารเคมีกำจัดปลวก: กลุ่มไพรีทรอยด์ (Pyrethroid) หรือกลุ่มที่ไม่ขับไล่ปลวก (Non-repellent)
    เช่น Fipronil หรือ Imidacloprid ที่ขึ้นทะเบียนถูกต้องกับสำนักงานคณะกรรมการอาหารและยา
    (อย.)
- สารเคมีต้องปลอดภัยต่อมนุษย์ สัตว์เลี้ยง และสิ่งแวดล้อม และคงฤทธิ์ปกป้องในดินได้ยาวนาน
- หัวอัดน้ำยาเคมี (Injector Port): ติดตั้งหัวรับน้ำยาพร้อมฝาครอบสแตนเลส/ทองเหลือง
    เหนือระดับผิวดินภายนอกอาคารประมาณ 100 มม.
surface_preparation:
- หลังหล่อคานคอดิน ถอดไม้แบบ และถมดินปรับระดับใต้พื้นชั้นล่างเรียบร้อย ปราศจากเศษไม้
  ขี้เลื่อย และขยะอินทรีย์
- ตรวจสอบแนวคานคอดิน: คานจมดินให้ติดตั้งท่อต่ำกว่าดินไม่เกิน 100 มม., คานลอยให้ติดตั้งท่อสูงกว่าท้องคาน
    100 มม.
- จัดทำ Shop Drawing แสดงผังการเดินท่อ ตำแหน่งหัวฉีดน้ำยา และจุดรับหัวเติมน้ำยารอบอาคาร
- ห้ามฉีดพ่นน้ำยาเคมีในขณะฝนตก ดินเปียกแฉะ มีน้ำท่วมขัง หรือดินกำลังเคลื่อนสไลด์
application_system:
- ติดตั้งท่ออัดน้ำยาเคมียึดติดกับคานคอดินด้านในรอบอาคารและคานซอยช่วงกลางอาคารด้วยแคล้มป์ทุกระยะ
  80 ซม. ความยาวท่อไม่เกินช่วงละ 15 ม.
- ติดตั้งหัวฉีดน้ำยาทุกระยะห่างไม่เกิน 1.00 ม. หันหัวฉีดลงสู่ผิวดินใต้อาคารเพื่อให้น้ำยากระจายตัวครอบคลุมทั่วถึง
- อัดน้ำยาเคมีลงดินรอบตอม่อและคานคอดินที่สัมผัสผิวดินลึกประมาณ 300 มม. ห่างจากโครงสร้าง
  200 มม. จุดละ 5 ลิตร ทุกระยะ 1 ม. ตามแนวยาว
- พ่นน้ำยาเคมีเคลือบผิวดินใต้พื้นอาคารแบบครอบคลุมทุกตารางเมตร ในอัตราส่วนน้ำยาผสมเสร็จ
  5 ลิตร ต่อ 1 ตารางเมตร ก่อนเทคอนกรีตพื้น
- ทดสอบการอัดน้ำยาเคมีผ่านระบบท่อก่อนปิดแผ่นพื้น และฉีดพ่นเคลือบดินรอบนอกตัวอาคารห่างแนวคานไม่น้อยกว่า
  1.00 ม. อัตรา 5 ลิตร/ตร.ม.
- ออกหนังสือรับประกันคุณภาพงานป้องกันปลวกเป็นเวลา 3 ปี พร้อมตรวจเช็คสภาพหน้างานทุกๆ
  6 เดือน
