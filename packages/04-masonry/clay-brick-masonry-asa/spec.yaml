id: CLAY_BRICK_MASONRY_ASA
name: งานผนังก่ออิฐมอญและอิฐก่อสร้าง (Brick Masonry - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: masonry_brick
masterformat: 04 21 13 - Brick Masonry
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 04 21 13
  tis: มอก. 77-2545 (อิฐก่อสร้างสามัญ), มอก. 1776-2542 (ปูนก่อสำเร็จรูป)
  dpt: มาตรฐาน มยผ. 1106-52
general_properties:
- อิฐมอญต้องเป็นชนิดเผาสุกสม่ำเสมอ แกร่ง ไม่มีรอยแตกร้าว หัก บิ่น ขนาดสม่ำเสมอ 65x140x40
  มม. ตาม มอก. 77-2545
- คอนกรีตบล็อกโชว์แนว ผิวเรียบ ขนาด 190x390x90 มม. และสกรีนบล็อกระบายอากาศกันฝนลิ้นคู่
- อิฐแก้ว (Glass Block) ขนาด 190x190x80 มม. สีใส ลวดลายตามวัตถุประสงค์ของผู้ออกแบบ
- ปูนก่อสำเร็จรูปตามมาตรฐานอุตสาหกรรม หรือปูนทรายผสมน้ำสะอาดปราศจากกรด ด่าง และสิ่งเจือปน
- เสาเอ็นและคานทับหลัง ค.ส.ล. ใช้คอนกรีตเสริมเหล็ก ขนาดไม่เล็กกว่า 15 ซม. หนาเท่าแผ่นอิฐ
  เสริมเหล็ก 2 เส้น Dia 6 มม. ปลอกลูกโซ่ Dia 6 มม. @ 0.20 ม.
surface_preparation:
- ทำความสะอาดพื้นผิวโครงสร้าง ค.ส.ล. บริเวณที่จะก่อผนัง กำจัดคราบฝุ่น น้ำมัน และเศษปูน
- ตีเส้นแนวก่อทั้งแนวระนาบและแนวดิ่ง พร้อมดิ่งถ่ายระดับให้ถูกต้องตามแบบสถาปัตยกรรม
- นำก้อนอิฐไปแช่น้ำหรือรดน้ำให้ชุ่มทั่วถึงก่อนนำมาก่อ เพื่อป้องกันการแย่งน้ำจากมอร์ต้าปูนก่อ
- เสียบเหล็กหนวดกุ้ง Dia 6 มม. ยาวไม่น้อยกว่า 30 ซม. ฝังในโครงสร้างเสา ค.ส.ล. ทุกระยะความสูงไม่เกิน
  40 ซม.
application_system:
- เริ่มก่อแถวแรกบนปูนทรายปรับระดับ วางสลับแนวรอยต่อ (Stretcher Bond) หนาสม่ำเสมอ 10-15
  มม. และแต่งปูนก่อเต็มรอยต่อ
- ก่อผนังทุกความยาวไม่เกิน 2.50 ม. ต้องมีเสาเอ็น ค.ส.ล. และทุกความสูงไม่เกิน 2.00
  ม. ต้องมีคานทับหลัง ค.ส.ล.
- รอบช่องเปิดประตู-หน้าต่าง ปลายผนังหยุดลอย และมุมหัก ต้องหล่อเสาเอ็นและคานทับหลังรัดรอบ
- การก่อในแต่ละวันต้องสูงไม่เกิน 1.00-1.50 ม. และทิ้งไว้อย่างน้อย 3 ชั่วโมงก่อนก่อต่อ
  เพื่อป้องกันผนังทรุดหรือล้มดิ่ง
- การก่อชนท้องคาน ค.ส.ล. ต้องเว้นช่องว่างไว้ไม่น้อยกว่า 15 ซม. ทิ้งไว้อย่างน้อย 24
  ชั่วโมง แล้วจึงก่ออิฐตามเฉียงอัดแน่น
- กรณีผนังชนโครงสร้างที่อาจแอ่นตัว (Post-tension, โครงสร้างเหล็ก) ให้เว้นด้านบน 25
  มม. สอดโฟมหนา 1 นิ้วตลอดแนว
- งานกรีดฝังท่อร้อยสายไฟหรือท่อสุขาภิบาล ให้ใช้เครื่องตัดไฟเบอร์ อุดปูนแน่น และปิดทับด้วยตะแกรงลวดกว้าง
  20-30 ซม. ก่อนงานฉาบ
