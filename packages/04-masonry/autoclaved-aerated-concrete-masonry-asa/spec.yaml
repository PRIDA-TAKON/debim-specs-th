id: AUTOCLAVED_AERATED_CONCRETE_MASONRY_ASA
name: งานผนังก่อคอนกรีตมวลเบา (Autoclaved Aerated Concrete Masonry - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: masonry_aac
masterformat: 04 22 19 - Autoclaved Aerated Concrete Masonry
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 04 22 19
  tis: มอก. 1505-2541 (ชิ้นส่วนคอนกรีตมวลเบาแบบมีฟองอากาศ-อบไอน้ำ), มอก. 1776-2542
    (ปูนก่อสำเร็จรูป)
  dpt: มาตรฐาน มยผ. 1106-52
general_properties:
- บล็อกคอนกรีตมวลเบาอบไอน้ำ (AAC) ชนิดไม่เสริมเหล็ก ขนาด 200x600x75 มม. หรือ 200x600x100
  มม. ตาม มอก. 1505-2541
- ปูนก่อสำเร็จรูปชนิดกาวบาง (Glue Mortar) สำหรับงานคอนกรีตมวลเบาโดยเฉพาะ แรงยึดเหนี่ยวสูง
  หนาประมาณ 3 มม.
- อุปกรณ์ยึดเหนี่ยวพิเศษ: แผ่นเหล็กยึดโครงสร้าง (Metal Strap) หนาตามมาตรฐาน ยาวประมาณ
    200 มม. พร้อมพุกสกรู
- เสาเอ็นและทับหลัง ค.ส.ล. กว้างเท่าบล็อก หนาไม่น้อยกว่า 150 มม. เสริมเหล็ก 2-RB6
  มม. ปลอก RB6 มม. @ 0.20 ม.
surface_preparation:
- ทำความสะอาดพื้นผิวโครงสร้างบริเวณที่จะก่อผนัง ตีเส้นแนวก่อทั้งแนวระดับและแนวดิ่ง
- รดน้ำที่สันก้อนคอนกรีตมวลเบาเพื่อทำความสะอาดและลดการแย่งน้ำจากปูนก่อ
- ก่อแถวแรกด้วยปูนทรายธรรมดาเพื่อปรับระดับพื้นให้ได้ระนาบแนวราบและได้ระดับเสมอกันก่อนเริ่มก่อบล็อกแถวถัดไป
- ตรวจเช็คแนวดิ่งและแนวระดับด้วยค้อนยางและระดับน้ำอย่างประณีต
application_system:
- ก่อชั้นถัดไปด้วยเกรียงหวีก่อปูนกาว ป้ายปูนกาวหนาประมาณ 3 มม. ทั้งด้านข้างและด้านบนของก้อนบล็อกอย่างต่อเนื่องเต็มหน้าสัมผัส
- การก่อต้องสลับแนวเหลื่อมกันไม่น้อยกว่ากึ่งก้อน หรืออย่างน้อย 100 มม. และเคาะปรับแต่งด้วยค้อนยาง
- ยึดผนังเข้ากับเสาโครงสร้างด้วยแผ่นเหล็ก Metal Strap ทุกระยะ 2 ชั้นของก้อนบล็อก ขันยึดด้วยพุกสกรู
- จัดให้มีเสาเอ็น ค.ส.ล. ทุกความยาวผนังเกิน 2.40 ม. และคานทับหลังทุกความสูงเกิน 2.00
  ม. รวมถึงรอบวงกบช่องเปิดทุกด้าน
- การก่อชนใต้ท้องคาน ค.ส.ล. ให้เว้นช่องว่างประมาณ 15 มม. อุดด้วยปูนทรายและยึดแผ่นเหล็ก
  Metal Strap ทุกระยะไม่เกิน 1.20 ม.
- กรณีชนโครงสร้างแอ่นตัว (Post-tension) ให้เว้น 25 มม. แล้วเสริมด้วยโฟมหนา 25 มม.
  กว้างเท่าบล็อกตลอดแนว
- การกรีดฝังท่อระบบ ให้ใช้เครื่องตัดหรือเหล็กเซาะร่อง อุดแน่นด้วยปูนทราย และปิดทับด้วยตะแกรงลวดกว้าง
  20-30 ซม. ก่อนฉาบ
