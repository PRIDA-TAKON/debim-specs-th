id: PORTLAND_CEMENT_PLASTERING_ASA
name: งานฉาบปูนซีเมนต์ (Portland Cement Plastering - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตปูนซีเมนต์ชั้นนำ
category: finishes_plastering
masterformat: 09 24 00 - Portland Cement Plastering
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 24 00
  tis: มอก. 80-2550 (ปูนซีเมนต์ผสม), มอก. 1776-2542 (ปูนฉาบสำเร็จรูป), มอก. 2595-2556
    (ปูนฉาบมวลเบา)
  dpt: มาตรฐาน มยผ. 1106-52, ASTM C926
general_properties:
- ปูนฉาบสำเร็จรูปชนิดละเอียดสำหรับผนังก่ออิฐ, ชนิดฉาบผิวคอนกรีต, ชนิดฉาบผิวบาง (Skim
  Coat) หนา 1-3 มม. และปูนฉาบขาว
- น้ำยาประสานคอนกรีต (Bonding Agent) ชนิดอะคริลิกโพลิเมอร์ สำหรับประสานปูนฉาบเก่า-ใหม่
  และทารองพื้นคอนกรีต
- เซี้ยมและร่อง PVC สำเร็จรูป คุณภาพได้มาตรฐาน ตรง ไม่บิดงอ สำหรับงานจับมุมและเซาะร่องกันร้าว
- ตะแกรงลวดกรงไก่ตาข่ายสี่เหลี่ยมจัตุรัส ขนาดช่อง 3/4 นิ้ว สำหรับเสริมแรงรอยต่อโครงสร้าง
- ความหนาของชั้นปูนฉาบรวมสองชั้นต้องไม่น้อยกว่า 15 มม. และไม่เกิน 25 มม. ผิวเรียบเนียนสม่ำเสมอ
surface_preparation:
- ผนังก่อหรือผิวคอนกรีตต้องก่อเสร็จแล้วไม่น้อยกว่า 3 วัน สะอาด ปราศจากฝุ่น คราบน้ำมัน
  หรือเศษมอร์ต้า
- สลัดดอกหรือกะเทาะผิวคอนกรีตที่เรียบเกินไปให้ขรุขระ หรือทาน้ำยาประสานคอนกรีตก่อนฉาบ
- ติดตั้งตะแกรงลวดกว้างไม่น้อยกว่า 300 มม. บริเวณแนวรอยต่อระหว่างผนังก่อกับเสา/คาน
  ค.ส.ล., รอบมุมวงกบประตู-หน้าต่าง และแนวกรีดท่อระบบ
- ตรวจสอบแนวดิ่ง-ฉาก จับปุ่มระดับห่างกันไม่เกิน 2.00 ม. และจับเซี้ยมตามมุมเสาคานให้ตรงเรียบร้อย
- ฉีดน้ำรดผนังให้ชุ่มชื้นทั่วถึงล่วงหน้าก่อนฉาบ เพื่อป้องกันผนังแย่งน้ำจากปูนฉาบ
application_system:
- ฉาบชั้นแรก (ชั้นรองพื้น) หนาประมาณ 8 มม. กดปูนให้แน่นเต็มพื้นที่ กวาดผิวหน้าตามแนวนอนให้หยาบ
  บ่มน้ำ 3 วัน ทิ้งให้แห้ง 5 วัน
- ฉาบชั้นที่สอง (ชั้นตกแต่ง) หนาประมาณ 7 มม. ปาดแต่งผิวให้เรียบเสมอปุ่มระดับ แล้วใช้ฟองน้ำชุบน้ำหมาดๆ
  กวาดปั่นผิวหน้าให้เรียบเนียน
- กรณีปูนฉาบหนาเกิน 25 มม. ต้องแบ่งฉาบเป็นหลายชั้นและเสริมด้วยตะแกรงลวด
- ทำร่องเซาะร่องปูนฉาบขนาดไม่น้อยกว่า 6 มม. ทุกระยะไม่เกิน 4.00x4.00 ม. เพื่อควบคุมการแตกร้าว
- การบ่มผิว: ฉีดน้ำพ่นฝอยวันละ 4-5 ครั้ง ต่อเนื่องกันไม่น้อยกว่า 6 วัน เพื่อป้องกันการแตกลายงา
    (Crazing)
- ทดสอบการยึดเกาะโดยการเคาะฟังเสียง ผิวปูนฉาบต้องแน่นสนิท ปราศจากเสียงโปร่ง รอยบวม
  รอยร้าว หรือร่อนหลุด
