id: GYPSUM_BOARD_SYSTEM_ASA
name: งานฝ้าเพดานและผนังยิบซั่มบอร์ด (Gypsum Board - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตยิบซั่มชั้นนำ
category: finishes_gypsum_board
masterformat: 09 29 00 - Gypsum Board
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 29 00
  tis: มอก. 219-2552 (แผ่นยิปซัม), มอก. 863-2532 (โครงคร่าวโลหะสำหรับแผ่นยิปซัม)
  dpt: มาตรฐาน ASTM C1396, ASTM C645
general_properties:
- แผ่นยิบซั่มบอร์ด หนา 9 มม. หรือ 12 มม. ขนาด 1.20x2.40 ม. ชนิดขอบลาด (Tapered Edge)
  สำหรับฝ้าฉาบเรียบ และขอบเรียบสำหรับ T-Bar ชนิดธรรมดา กันชื้น (Moisture Resistant)
  กันไฟ หรือบุฟอยล์
- โครงเคร่าโลหะชุบสังกะสี หนาไม่น้อยกว่า 0.50 มม. สำหรับโครงผนัง (C-Stud 30x70 มม.
  / U-Track) และโครงฝ้าเพดานฉาบเรียบ (14x37 มม.)
- โครงเคร่าฝ้า T-Bar เหล็กชุบสังกะสีเคลือบสีอบขาว พับ 2 ชั้น โครงหลักสูงไม่น้อยกว่า
  38 มม. โครงซอยสูงไม่น้อยกว่า 28 มม.
- อุปกรณ์แขวน: ลวดแขวนเหล็กชุบสังกะสี Dia 4 มม. สปริงปรับระดับสแตนเลสรูปปีกผีเสื้อ
    และพุกเหล็กยึดท้องพื้น
- ปูนฉาบรอยต่อยิบซั่ม เทปเยื่อกระดาษหรือเทปผ้ายึดรอยต่อ และสกรูยิงยิบซั่มปลายแหลมรมดำกันสนิมยาว
  25 มม.
surface_preparation:
- ตรวจสอบระดับความสูงของฝ้าเพดานและแนวผนังตามแบบสถาปัตยกรรม
- ประสานงานและตรวจสอบงานระบบท่อ งานสายไฟ โคมไฟ หัวสปริงเกลอร์ และท่อปรับอากาศเหนือฝ้าให้เรียบร้อย
- ตีเส้นระดับโครงเคร่ารอบผนังและกำหนดตำแหน่งแขวนโครงหลักให้ได้ระดับและระยะห่างถูกต้อง
- จัดทำ Shop Drawing แสดงแนวโครงเคร่า ตำแหน่งดวงโคม หน้ากากแอร์ และช่องเปิดซ่อมบำรุง
  (Access Door)
application_system:
- การติดตั้งฝ้าฉาบเรียบ: ยึดฉากริมกับผนัง แขวนโครงหลักระยะห่าง 1.00 ม. ยึดโครงซอยห่าง
    400 มม. ด้วยตัวล็อกโครง ปรับระดับให้เรียบระนาบด้วยสปริงผีเสื้อ
- การยิงแผ่นยิบซั่ม: ติดตั้งแผ่นขอบลาดวางด้านยาวตั้งฉากกับโครงซอย ปลายแผ่นสลับแนวกัน
    1.20 ม. ยึดด้วยสกรูยิบซั่มห่าง 240 มม. หัวสกรูจมใต้ผิว 1-2 มม. ไม่ทะลุกระดาษ
- การฉาบรอยต่อ: ฉาบปูนรอยต่อชั้นแรก ปิดเทปกระดาษกดยึดแน่น ฉาบทับอีก 2 ชั้น ปาดให้เรียบ
    ทิ้งให้แห้งแล้วขัดด้วยกระดาษทรายเบอร์ละเอียดให้เรียบเนียนเป็นเนื้อเดียวกัน
- การติดตั้งผนังยิบซั่ม: ยึดราง U-Track กับพื้นและเพดาน ใส่โครง C-Stud ทุกระยะ 400
    มม. กรุแผ่นยกสูงจากพื้น 10 มม. กันความชื้น พร้อมอุดยาแนว
- การติดตั้งฝ้า T-Bar: ติดตั้งโครงหลักห่าง 1.20 ม. โครงซอยห่าง 600 มม. ได้ตาราง 600x600
    มม. ปรับระดับแล้ววางแผ่นยิบซั่มลวดลายตามแบบ
