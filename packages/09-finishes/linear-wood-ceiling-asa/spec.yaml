id: LINEAR_WOOD_CEILING_ASA
name: งานฝ้าระแนงไม้ (Linear Wood Ceiling - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: finishes_wood_ceiling
masterformat: 09 54 26 - Linear Wood Ceiling
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 54 26
  tis: มอก. 192-2549 (ไม้แปรรูป)
  dpt: มาตรฐานกรมป่าไม้ กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม
general_properties:
- ไม้ระแนงใช้ไม้แดงขนาด 25x100 มม. (1x4 นิ้ว) อบแห้ง ไสเรียบ 4 ด้าน ลบมุมเล็กน้อย
  ทาสีย้อมเนื้อไม้ชนิดภายนอก หรือใช้ระแนงไม้สังเคราะห์ทาสีอะคริลิก
- โครงเคร่าไม้ใช้ไม้ยางอัดน้ำยากันปลวก ขนาด 37.5x75 มม. (1.5x3 นิ้ว) ระยะห่าง 0.60x0.60
  ม. หรือโครงเคร่าเหล็กชุบสังกะสีพร้อมอุปกรณ์แขวนมาตรฐาน
- มุ้งลวดไนลอนสีดำสำหรับติดใต้โครงเคร่าเพื่อป้องกันแมลง นก และสัตว์เลื้อยคลาน
- บัวฝ้าระแนงไม้ชนิดและขนาดเดียวกับระแนง ลบมุมเล็กน้อย ปิดทับแนวรอยต่อชนผนังและชายคา
surface_preparation:
- ตรวจสอบระดับท้องพื้น ค.ส.ล. หรือโครงสร้างหลังคาที่จะแขวนยึดโครงฝ้าระแนงไม้
- ประสานงานและติดตั้งงานเดินท่อสายไฟ โคมไฟ และท่อระบายน้ำฝนเหนือฝ้าให้เรียบร้อย
- จัดทำ Shop Drawing แสดงแนวทิศทางการวางระแนงไม้ รอยต่อ และช่องเซอร์วิสเพื่อขออนุมัติ
application_system:
- ติดตั้งโครงเคร่าไม้ระยะ 0.60x0.60 ม. ให้ได้ระดับระนาบและแข็งแรง ยึดแขวนกับโครงสร้างอาคารทุกระยะ
  1.20x1.20 ม.
- ขึงมุ้งลวดไนลอนสีดำใต้โครงเคร่าให้ตึงเรียบก่อนเริ่มตีระแนงไม้
- ติดตั้งไม้ระแนงตีเว้นร่อง 4 มม. สม่ำเสมอ ยึดด้วยตะปูซ่อนหัว แนวระแนงตั้งฉากกับตัวอาคาร
  และมุมหักชายคาให้ตัดชนมุม 45 องศา
- ติดตั้งบัวฝ้าระแนงไม้ปิดรอยต่อชนผนังและชายคาโดยรอบ
- อุดหัวตะปูด้วยวัสดุยาแนวชนิดทาสีทับได้ ขัดแต่งด้วยกระดาษทรายให้เรียบเนียน และทาสีย้อมรักษาเนื้อไม้ตามมาตรฐานงานทาสี
