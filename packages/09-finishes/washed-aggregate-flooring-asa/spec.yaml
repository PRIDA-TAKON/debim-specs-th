id: WASHED_AGGREGATE_FLOORING_AND_FACING_ASA
name: งานพื้นและผนังหินล้าง/กรวดล้าง (Washed Aggregate Flooring and Facing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: finishes_washed_aggregate
masterformat: 09 66 43 - Washed Aggregate Flooring
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 66 43 และ 09
    77 43
  tis: มอก. 133-2556 (ปูนซีเมนต์ขาว), มอก. 15 เล่ม 1-2547 (ปูนซีเมนต์ปอร์ตแลนด์)
  dpt: มาตรฐาน มยผ. 1106-52
general_properties:
- เม็ดหิน: หินอ่อนคัดพิเศษล้างสะอาด ขนาดสม่ำเสมอ 3-4 มม. ผ่านการร่อนตะแกรง ปราศจากฝุ่นและสิ่งเจือปน
- เม็ดกรวด: กรวดทะเลคัดเม็ดกลมมน ล้างสะอาด ขนาด 2-3 มม.
- ปูนซีเมนต์ขาวสำหรับงานหินล้าง และปูนซีเมนต์ปอร์ตแลนด์สีเทาสำหรับงานกรวดล้าง พร้อมสีฝุ่นผสมซีเมนต์คุณภาพสูง
- เส้นแบ่งแนว: เส้นพีวีซี (PVC Divider Strip) ขนาด 6x10 มม. หรือไม้สักเซาะร่อง 5x10
    มม. ขนาดช่องไม่เกิน 2.00x2.00 ม.
- น้ำยาเคลือบเงาใสอะคริลิกหรือแว็กซ์ (Wax) เคลือบผิวป้องกันตะไคร่น้ำและคราบสกปรก
surface_preparation:
- ทำความสะอาดพื้นผิวคอนกรีตให้สะอาดปราศจากคราบมันและเศษผง
- เทปูนทรายปรับระดับพื้นหรือฉาบผนังรองพื้นให้ได้ดิ่ง ฉาก และระดับ โดยเผื่อความหนาสำหรับผิวหินล้าง/กรวดล้าง
  15 มม. บ่มน้ำ 3 วัน
- ติดตั้งเส้นแบ่งแนว PVC หรือเส้นไม้สักตามแบบ Shop Drawing ยึดด้วยปูนทรายให้ได้แนวตรงและได้ระดับ
  ทิ้งให้แห้งอย่างน้อย 24 ชั่วโมง
- จัดทำแผ่นตัวอย่างขนาด 300x300 มม. แสดงเฉดสี ขนาดเม็ดหิน และลวดลายให้ผู้ควบคุมงานอนุมัติก่อนทำจริง
application_system:
- รดน้ำผิวรองพื้นให้ชุ่มชื้น แล้วสลัดน้ำปูนซีเมนต์เข้มข้นเป็นตัวประสานก่อนลงมอร์ต้าหินล้าง
- ผสมซีเมนต์ 1 ส่วน ต่อเม็ดหินหรือกรวด 3 ส่วน ผสมน้ำสะอาดให้ข้นพอเหมาะ เทหรือฉาบลงในช่อง
  ตบอัดให้แน่นเสมอขอบเส้นแบ่งแนว
- ทิ้งไว้ให้ปูนเริ่มหมาดประมาณ 30 นาที แล้วใช้แปรงจุ่มน้ำสะอาดค่อยๆ กวาดล้างผิวหน้าปูนออกจนเม็ดหินโผล่เด่นชัดสม่ำเสมอ
  ทิ้งให้แห้ง 1 วัน
- ล้างทำความสะอาดคราบปูนซีเมนต์ที่หลงเหลือด้วยกรดเกลือผสมน้ำอัตราส่วน 1:20 แล้วล้างน้ำสะอาดออกให้หมด
- ปล่อยให้แห้งสนิทไม่น้อยกว่า 2 วัน ทำความสะอาด เช็ดแห้ง แล้วเคลือบผิวด้วย Wax หรือน้ำยาเคลือบใสอะคริลิกอย่างน้อย
  1 ครั้ง
