id: TILING_ASA
name: งานปูกระเบื้องเซรามิคและกระเบื้องดินเผา (Tiling - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตกระเบื้องมาตรฐาน มอก.
category: finishes_tiling
masterformat: 09 30 00 - Tiling
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 30 00
  tis: มอก. 2508-2555 (กระเบื้องเซรามิก), มอก. 2703-2559 (กาวซีเมนต์ปูกระเบื้อง),
    มอก. 2704-2559 (กาวยาแนวกระเบื้อง)
  dpt: มาตรฐาน ANSI A118 Series, ISO 13007
general_properties:
- กระเบื้องเซรามิคคุณภาพเกรด A (First Grade) ชนิดผิวกันลื่นสำหรับพื้น และผิวมันสำหรับผนัง
  ขนาดและสีตามแบบระบุ ปราศจากรอยแตกร้าว บิดงอ หรือสีเพี้ยน
- กระเบื้องดินเผาและโมเสกขัดมัน คุณภาพมาตรฐาน มีการดูดซึมน้ำต่ำตามเกณฑ์กำหนด
- กาวซีเมนต์ปูกระเบื้อง (Cementitious Tile Adhesive) คุณภาพสูง มีแรงยึดเกาะและยืดหยุ่นตัวดี
  ตาม มอก. 2703
- กาวยาแนวกระเบื้องชนิดป้องกันเชื้อราดำและตะไคร่น้ำ (Anti-fungal Tile Grout) ทนสารเคมี
  ตาม มอก. 2704
- น้ำยาเคลือบผิวใสกันซึม และน้ำยาเคลือบเงาแว็กซ์ (Wax) สำหรับปกป้องผิวกระเบื้อง
surface_preparation:
- ทำความสะอาดพื้นผิวให้ปราศจากคราบไขมัน ฝุ่น และสิ่งสกปรก
- เทปูนทรายปรับระดับพื้นให้ได้ความลาดเอียงระบายน้ำไปยัง Floor Drain และฉาบปรับผิวผนังให้ได้ดิ่งและฉาก
  ทิ้งไว้ 24 ชั่วโมงและบ่มน้ำ 3 วัน
- สำหรับพื้นห้องน้ำ ระเบียง หรือชั้นล่างติดดิน ต้องทำระบบกันซึมและผ่านการทดสอบขังน้ำ
  72 ชั่วโมงก่อนปูกระเบื้อง
- วางแผนจัดแนวกระเบื้อง (Tile Layout) กำหนดแนวรอยต่อและตำแหน่งตัดเศษกระเบื้องตาม Shop
  Drawing โดยเศษกระเบื้องต้องเหลือเท่ากันสองข้างและไม่น้อยกว่าครึ่งแผ่น
application_system:
- ใช้เกรียงหวีปาดกาวซีเมนต์ลงบนพื้นผิวและปาดเคลือบหลังกระเบื้อง (Back Buttering) ให้ทั่วถึง
  ไม่เป็นโพรงอากาศ
- วางแผ่นกระเบื้องลงบนกาวซีเมนต์ เคาะปรับระดับด้วยค้อนยาง รักษาร่องรอยต่อด้วยอุปกรณ์จัดแนวกระเบื้อง
  (Spacer) ร่องห่าง 2 มม. หรือตามระบุ
- การเข้ามุมเสาและขอบกระเบื้องให้ใช้วิธีเจียรลบมุม 45 องศา (Mitred Edge) ประกบเข้ามุมเนียนเรียบ
  หรือใช้คิ้ว PVC/สแตนเลสตามแบบ
- ปล่อยให้กาวซีเมนต์เซ็ตตัวไม่น้อยกว่า 48 ชั่วโมงโดยห้ามเหยียบย่ำ จากนั้นยาแนวร่องกระเบื้องด้วยกาวยาแนวชนิดกันราดำ
- เช็ดทำความสะอาดผิวกระเบื้องด้วยฟองน้ำชุบน้ำหมาดๆ ทิ้งให้แห้งสนิท 24 ชั่วโมง แล้วขัดเงาเคลือบผิวด้วย
  Wax อย่างน้อย 1 ครั้ง
