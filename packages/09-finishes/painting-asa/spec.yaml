id: PAINTING_ASA
name: งานทาสี (Painting - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตสีมาตรฐาน มอก.
category: finishes_painting
masterformat: 09 91 00 - Painting
warranty_years: 5
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 91 00
  tis: มอก. 272-2549 (สีอิมัลชัน), มอก. 2625-2557 (สีน้ำมันอัลคีด), มอก. 285-2554
    (สีรองพื้นกันสนิม)
  dpt: มาตรฐาน มยผ. 1106-52
general_properties:
- สีน้ำทาภายนอกและภายใน: สีน้ำอะคริลิกแท้ 100% ชนิดกึ่งเงาหรือเนียน ทนทานต่อรังสี
    UV เชื้อรา ตะไคร่น้ำ และเช็ดล้างทำความสะอาดได้
- สีรองพื้นปูนใหม่กันด่าง (Alkali Resisting Primer) สำหรับผนังปูนฉาบและคอนกรีต
- สีน้ำมันอัลคีด (Alkyd Enamel) คุณภาพสูง สำหรับงานทาผิวไม้และโลหะ พร้อมสีรองพื้นกันสนิม
  Red Lead หรือ Zinc Chromate
- สีย้อมรักษาเนื้อไม้ (Wood Stain) ชนิดโปร่งแสงโชว์ลายไม้ สำหรับงานไม้ธรรมชาติ และสีเคลือบแข็งโพลียูรีเทน
  2 ส่วน
- สีทาพื้นอีพ็อกซี่ (Epoxy Floor Coating) หนาไม่น้อยกว่า 0.3 มม. และสีพ่นแกรนิตสังเคราะห์ภายนอก
- บรรจุภัณฑ์ต้องปิดสนิทจากโรงงาน มีฉลากและตรารับรอง มอก. ชัดเจน
surface_preparation:
- ผิวปูนฉาบหรือคอนกรีตต้องแห้งสนิทอย่างน้อย 21-28 วัน ความชื้นไม่เกิน 14% และค่าด่าง
  (pH) ไม่เกิน 8-9 ขจัดฝุ่น คราบไขมัน และคราบปูน
- ผิวเหล็ก: ขจัดคราบไขมันด้วยทินเนอร์ ขัดสนิมและสแลกด้วยแปรงลวดหรือเครื่องเจียรให้เห็นเนื้อเหล็ก
    ทาสีรองพื้นกันสนิมภายใน 4 ชั่วโมง
- ผิวไม้: อบแห้งความชื้นไม่เกิน 18% ขัดกระดาษทรายตามเสี้ยนไม้ อุดรูหัวตะปูและรอยแตกร้าวด้วยสีโป๊วไม้
    ทาสีรองพื้นไม้อลูมิเนียมป้องกันยางไม้ตกค้าง
- ห้ามทาสีขณะฝนตก สภาพอากาศชื้นจัด หรือบนพื้นผิวที่ยังเปียกชื้น
application_system:
- งานทาสีปูน: ทาสีรองพื้นปูนใหม่กันด่าง 1 เที่ยว ทิ้งให้แห้ง 2 ชั่วโมง ทาสีน้ำทับหน้าอะคริลิก
    100% จำนวน 2 เที่ยว ทิ้งระยะระหว่างเที่ยวอย่างน้อย 4 ชั่วโมง
- งานทาสีเหล็ก: ทาสีรองพื้นกันสนิม Red Lead หรือ Zinc Chromate 2 เที่ยว ทิ้งระยะเที่ยวละ
    6 ชั่วโมง ทาทับหน้าด้วยสีน้ำมัน 2 เที่ยว ทิ้งระยะเที่ยวละ 8 ชั่วโมง
- งานทาสีย้อมไม้: ทาสีย้อมไม้ชนิดภายนอก 3 เที่ยว ทิ้งระยะระหว่างเที่ยวละ 8 ชั่วโมง
    และลูบกระดาษทรายบางๆ ระหว่างเที่ยว
- งานทาโพลียูรีเทนพื้นไม้: ทาโพลียูรีเทนใส 3 เที่ยว ทิ้งระยะเที่ยวละ 6 ชั่วโมง ขัดผิวละเอียดเพื่อความเรียบเนียน
- ฟิล์มสีที่แห้งแล้วต้องเรียบเนียนสม่ำเสมอ สีตรงตามแค็ตตาล็อก ปราศจากรอยแปรง รอยหยด
  ย่น ลอกพอง หรือตามด
