id: CARPETING_ASA
name: งานพรม (Carpeting - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตพรมที่ได้รับมาตรฐานสากล
category: finishes_carpeting
masterformat: 09 68 00 - Carpeting
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 68 00
  tis: มอก. 2486-2553 (พรมปูพื้นทอเครื่อง)
  dpt: มาตรฐาน CRI Green Label Plus, ASTM D5252
general_properties:
- พรมทอเครื่อง (Tufted Carpet) ชนิดเส้นใยไนลอน 100% (Nylon 100%) หรืออะคริลิก 100%
  ผสมสารยับยั้งแบคทีเรียและเชื้อรา (Microban)
- ลักษณะขนพรม: ชนิดขนห่วง (Loop Pile) หรือขนตัด (Cut Pile) ตามระบุในแบบ ความหนาแน่นของพรมไม่น้อยกว่า
    40 กก./ลบ.ม. (2.5 ปอนด์/ลบ.ฟุต)
- แผ่นยางรองใต้พรม (Underlay Carpet Cushion): แผ่นฟองน้ำยางธรรมชาติ หนาไม่น้อยกว่า
    8 มม.
- อุปกรณ์ติดตั้ง: ไม้หนาม (Tack Strip) สำหรับขึงพรมรอบห้อง, คิ้วจบขอบอลูมิเนียม (Nap-Lock)
    และบัวเชิงผนังไม้สักขนาด 25x100 มม.
surface_preparation:
- ทำความสะอาดพื้นผิวปูนทรายขัดเรียบให้แห้งสนิท ปราศจากฝุ่น ผง คราบไขมัน และเศษปูน
- ตรวจสอบความชื้นของพื้นผิวคอนกรีต ต้องแห้งสนิทไม่มีความชื้นสะสม
- เก็บม้วนพรมในแนวราบในพื้นที่แห้ง สะอาด มีการระบายอากาศดี และห้ามพับหักม้วนพรม
- จัดทำ Shop Drawing แสดงทิศทางลายพรม รอยต่อ และแนวรอยเชื่อมเสนอขออนุมัติ
application_system:
- ติดตั้งไม้หนามรอบขอบห้องตามแนวผนัง เว้นระยะห่างจากผนังเท่ากับความหนาของพรม
- ปูแผ่นยางรองพรมหนา 8 มม. เต็มพื้นที่ ยึดด้วยกาวหรือเทปยึดรอยต่อให้เรียบเสมอกัน
- คลี่ผืนพรมออกและใช้เครื่องดึงยืดพรม (Knee Kicker / Power Stretcher) ดึงยืดพรมทุกทิศทางให้ตึงเรียบสนิทเข้าเกาะกับไม้หนาม
- ตัดเศษพรมส่วนเกินและสอดปลายพรมเก็บซ่อนหลังไม้หนามให้เรียบร้อย
- รอยต่อพรมต้องต่อชนสนิทและเย็บเชื่อมด้วยเทปความร้อน (Seaming Tape) จนมองไม่เห็นรอยต่อ
- ติดตั้งคิ้วอลูมิเนียม Nap-Lock บริเวณทางเข้าหรือจุดจบพรม และติดตั้งบัวเชิงผนังไม้ทับขอบพรมให้เรียบร้อย
  ดูดฝุ่นทำความสะอาดก่อนส่งมอบ
