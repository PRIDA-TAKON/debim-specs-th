id: WOOD_FLOORING_ASA
name: งานพื้นไม้ (Wood Flooring - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: finishes_wood_flooring
masterformat: 09 64 00 - Wood Flooring
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 64 00
  tis: มอก. 192-2549 (ไม้แปรรูป), มอก. 178-2549 (แผ่นไม้อัด)
  dpt: มาตรฐาน NWFA (National Wood Flooring Association)
general_properties:
- พื้นไม้สักเข้าลิ้น: ไม้สักทองคัดพิเศษ ขนาด 25x150x1800 มม. (1x6 นิ้ว) อบแห้ง ไสเรียบ
    2 ด้าน พร้อมพุกไม้แดงขนาด 25x50 มม. ฝังในปูนทรายขัดมัน
- พื้นไม้ปาร์เก้: ปาร์เก้ลิ้นร่องไม้มะค่าหรือไม้แดงคัดพิเศษ ขนาด 37.5x300x19 มม. (3x12
    นิ้ว) เคลือบสีโพลียูรีเทน
- พื้นไม้แดงภายนอก: ไม้แดงคัดพิเศษ 37.5x150x2000 มม. ไสเรียบ 4 ด้าน ลบมุม ตีเว้นร่อง
    3 มม. ติดตั้งบนตงไม้แดง 50x150 มม. @ 0.50 ม.
- พื้นไม้ลามิเนต/สำเร็จรูป หนาไม่น้อยกว่า 8 มม. รับประกันคุณภาพไม่น้อยกว่า 10 ปี
- กาวปูพื้นไม้ชนิดโพลียูรีเทน (Polyurethane Adhesive) ปราศจากน้ำ และสีเคลือบแข็งโพลียูรีเทนชนิดทนการขูดขีดสูง
surface_preparation:
- ทำความสะอาดพื้น ค.ส.ล. เทปูนทรายปรับระดับและขัดมันให้ได้ระนาบเรียบสนิท ไม่เป็นคลื่น
  บ่มน้ำ 3 วัน และทิ้งให้แห้งสนิทไม่น้อยกว่า 15 วัน
- ทดสอบความชื้นของพื้นผิวด้วยเครื่องวัดความชื้น (ความชื้นต้องไม่เกินเกณฑ์) หรือใช้แผ่นพลาสติกใสปิดผนึก
  3 วัน ต้องไม่มีหยดน้ำเกาะใต้แผ่น
- สำหรับพื้นชั้นล่างติดดิน ต้องทำระบบกันซึมใต้ปูนทรายปรับระดับอย่างสมบูรณ์
- จัดเรียงไม้เฉลี่ยสี ลายไม้ และทิศทางการวางไม้ตาม Shop Drawing เพื่อขออนุมัติก่อนปู
application_system:
- การปูไม้สักเข้าลิ้น: ฝังพุกไม้แดงระยะ 450 มม. ปูแผ่นไม้สักยึดกับพุกด้วยตะปูซ่อนหัวในรางลิ้น
    อัดแผ่นให้ชิดสนิทด้วยแม่แรงอัดพื้น เว้นร่องชนผนัง 8 มม.
- การปูปาร์เก้: ทากาวโพลียูรีเทนเต็มพื้นที่ด้วยเกรียงหวี ปูแผ่นปาร์เก้เข้าลิ้นรอยต่อสนิทตามแนวลายอิฐหรือลายก้างปลา
- การปูไม้เว้นร่องภายนอก: วางตงไม้แดงระยะ 500 มม. ยึดด้วยฉากสแตนเลสเหนือพื้นลาดเทระบายน้ำ
    ปูไม้แดงเว้นร่อง 3 มม. ยึดด้วยตะปูสแตนเลสซ่อนหัวลิ่มไม้
- ทิ้งให้กาวแห้งสนิทไม่น้อยกว่า 15 วัน ห้ามเดินเหยียบย่ำ จากนั้นขัดผิวด้วยเครื่องขัดหยาบและละเอียดจนเรียบเนียน
  ปราศจากรอยขีดข่วน
- ทาสีรองพื้นอุดเสี้ยน และทาสีเคลือบแข็งโพลียูรีเทนใสอย่างน้อย 3 เที่ยว ทิ้งระยะแห้งตัวเที่ยวละ
  6 ชั่วโมง และปกป้องผิวไม้จนส่งมอบงาน
