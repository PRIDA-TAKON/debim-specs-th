id: STONE_FLOORING_AND_FACING_ASA
name: งานพื้นปูหินและผนังบุหิน (Stone Flooring and Facing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตหินธรรมชาติคัดเกรด
category: finishes_stone
masterformat: 09 63 40 - Stone Flooring
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 09 63 40 และ 09
    75 00
  tis: มอก. 2703-2559 (กาวซีเมนต์ปูหินธรรมชาติ), มอก. 2704-2559 (กาวยาแนว)
  dpt: มาตรฐาน ASTM C615 (Granite), ASTM C503 (Marble)
general_properties:
- หินแกรนิตธรรมชาติ (Granite) คัดพิเศษ ขนาด 300x600x20 มม. (พื้น) และ 300x600x18 มม.
  (ผนัง) ชนิดขัดมัน หรือผิวพ่นไฟ/เป่าไฟกันลื่นสำหรับภายนอก
- หินทรายธรรมชาติ (Sandstone) ผิวเรียบจากแหล่งสระบุรีหรือตาก ขนาด 300x600x25 มม.
- กาวซีเมนต์ชนิดยืดหยุ่นตัวสูงสำหรับติดตั้งหินธรรมชาติ ป้องกันการเกิดคราบขาว (Efflorescence)
- ขอยึดสแตนเลส (Stainless Steel Anchors/Clamps) เกรด SUS 304 สำหรับงานติดตั้งผนังหินแห้ง
  (Dry System)
- น้ำยาเคลือบใสป้องกันความชื้นและกันซึมสำหรับหินธรรมชาติ (Silicone Impregnator) ทารอบด้าน
  5-6 ด้าน
- ซิลิโคนยาแนวร่องขยายตัวชนิด Non-Staining ไม่เกิดคราบน้ำมันซึมเข้าเนื้อหิน
surface_preparation:
- ทำความสะอาดพื้นผิวโครงสร้างให้สะอาด ปราศจากฝุ่น คราบไขมัน และเศษปูน
- เทปูนทรายปรับระดับพื้นหรือฉาบผนังรองพื้นให้ได้ดิ่ง ฉาก และระนาบ บ่มน้ำอย่างน้อย
  3 วัน ทิ้งให้แห้งสนิท
- ทาน้ำยาเคลือบใสป้องกันความชื้นรอบด้าน 5 ด้าน (ยกเว้นหน้าหินขัดมัน) หรือ 6 ด้านสำหรับหินผิวด้าน/พ่นไฟ
  อย่างน้อย 2 เที่ยวก่อนนำมาติดตั้ง
- คัดแยกแผ่นหิน จัดเรียงเกลี่ยเฉดสีและลวดลาย (Dry Laying) ให้กลมกลืนสม่ำเสมอทั่วพื้นที่และได้รับอนุมัติก่อนปู
application_system:
- งานปูพื้นหิน: โบกกาวซีเมนต์เต็มหลังแผ่นหินและพื้นผิว วางแผ่นหินเคาะปรับระดับให้แน่นสนิท
    ไม่เป็นโพรง รอยต่อชิดหรือเว้นร่องตามแบบ
- จัดให้มีร่องขยายตัว (Movement Joint) กว้างอย่างน้อย 3 มม. ทุกระยะไม่เกิน 4.00x4.00
  ม. สำหรับพื้น/ผนังภายใน และทุก 1.00x1.00 ม. สำหรับภายนอก อุดด้วยซิลิโคน Non-Staining
- งานผนังบุหินสูงเกิน 2.50 ม. ต้องติดตั้งด้วยระบบยึดแห้งโดยใช้ขอยึดสแตนเลสยึดเข้ากับโครงสร้างอาคารอย่างมั่นคง
- ทิ้งให้กาวซีเมนต์เซ็ตตัว 48 ชั่วโมง ยาแนวร่องด้วยกาวยาแนวชนิดกันราดำ เช็ดทำความสะอาดทันที
- ห้ามเดินผ่านหรือบรรทุกของหนักบนพื้นหินหลังปูเสร็จอย่างน้อย 7 วัน และปกป้องผิวหินด้วยการปูแผ่นพลาสติกหรือกระดาษลูกฟูกหนา
