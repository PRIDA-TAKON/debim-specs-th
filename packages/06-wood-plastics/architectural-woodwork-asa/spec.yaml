id: ARCHITECTURAL_WOODWORK_ASA
name: งานไม้สำหรับงานสถาปัตยกรรม (Architectural Woodwork - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และองค์การอุตสาหกรรมป่าไม้
category: wood_architectural
masterformat: 06 40 00 - Architectural Woodwork
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 06 40 00
  tis: มอก. 178-2549 (แผ่นไม้อัด), มอก. 192-2549 (ไม้แปรรูป)
  dpt: มาตรฐานกรมป่าไม้ กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม
general_properties:
- ไม้เนื้อแข็ง (ไม้เต็ง ไม้แดง) ต้องเป็นไม้แห้งสนิท ไสเรียบ ปราศจากกระพี้ รอยแตกร้าว
  บิดงอ ตาไม้ผุ หรือรอยแมลงทำลาย
- ไม้โครงเคร่าผนังและฝ้าเพดาน ใช้ไม้ยางพาราหรือไม้เนื้ออ่อนที่ผ่านการอบแห้งความชื้นเหลือไม่เกิน
  30% และอัดน้ำยากันปลวกจากโรงงาน
- ไม้วงกบประตู-หน้าต่าง ใช้ไม้แดงขนาด 2x4 นิ้ว (ประตูทั่วไป) และ 2x5 นิ้ว (ห้องน้ำ)
  พร้อมบังใบในตัวสูง 10-20 มม.
- ไม้อัดเกรด A และแผ่นไฟเบอร์ซีเมนต์ ความหนาตามแบบระบุ ปราศจากรอยบวมพอง แยกชั้น
surface_preparation:
- ตรวจสอบความชื้นของไม้ก่อนใช้งาน ไม้โครงสร้างและวงกบความชื้นต้องไม่เกิน 18% ส่วนไม้ตกแต่งภายในไม่เกิน
  12%
- วงกบไม้ต้องทาแชลแล็กขาวโดยรอบ 1 เที่ยว เพื่อป้องกันน้ำปูนซึมเข้าเนื้อไม้ขณะหล่อเสาเอ็นและทับหลัง
  ค.ส.ล.
- เซาะร่องหลังวงกบขนาด 20x10 มม. ตลอดความยาว เพื่อให้ยึดเกาะประสานแน่นกับเสาเอ็นและคานทับหลัง
- จัดทำ Shop Drawing ขยายแบบการต่อไม้ การเข้าเดือย การติดตั้ง และตัวอย่างชิ้นงานให้ผู้ควบคุมงานอนุมัติ
application_system:
- การประกอบเข้าไม้ต้องตัด บาก ไส และเข้าเดือยให้สนิทแน่นเต็มหน้าสัมผัส ห้ามต่อไม้กลางช่วงโดยไม่จำเป็น
- การยึดตะปูหรือสกรูต้องเจาะรูนำและฝังซ่อนหัวตะปู (Countersunk) ให้ต่ำกว่าผิวไม้ แล้วอุดแต่งให้เรียบเนียน
- การติดตั้งวงกบต้องได้แนวดิ่ง ฉาก และค้ำยันชั่วคราวอย่างมั่นคง ก่อนหล่อเสาเอ็นและคานทับหลัง
  ค.ส.ล. ล้อมรอบ
- ตีไม้ประกบหุ้มเหลี่ยมวงกบด้วยไม้อัดชั่วคราว เพื่อป้องกันขอบมุมบิ่นเสียหายระหว่างการก่อสร้างจนกว่าจะติดบานประตู
- รอยต่อระหว่างวงกบไม้กับผนังปูนฉาบ ให้เซาะร่อง 5x3 มม. แล้วอุดด้วยวัสดุยาแนวอะคริลิกชนิดทาสีทับได้
