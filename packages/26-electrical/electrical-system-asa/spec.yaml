id: ELECTRICAL_SYSTEM_ASA
name: งานระบบไฟฟ้าและสื่อสาร (Electrical System - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตอุปกรณ์ไฟฟ้ามาตรฐาน มอก.
category: electrical_system
masterformat: 26 00 00 - Electrical
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 26 00 00
  tis: มอก. 11-2531 (สายไฟฟ้าทองแดงหุ้มฉนวน PVC), มอก. 770-2533 (ท่อร้อยสายไฟเหล็ก),
    มอก. 824-2551 (สวิตช์ไฟฟ้า), มอก. 166-2549 (เต้ารับ)
  dpt: มาตรฐานการติดตั้งทางไฟฟ้าสำหรับประเทศไทย (วสท. 2001-56), มาตรฐานการไฟฟ้านครหลวง/ส่วนภูมิภาค
    (MEA/PEA), NEC (National Electrical Code)
general_properties:
- สายไฟฟ้าตัวนำทองแดงแท้บริสุทธิ์ไม่น้อยกว่า 98% หุ้มฉนวน PVC ทนแรงดันไม่ต่ำกว่า 750V
  ทนอุณหภูมิ 70°C ตาม มอก. 11-2531 โดยสายวงจรย่อยเต้ารับไม่เล็กกว่า 2.5 ตร.มม. และแสงสว่างไม่เล็กกว่า
  1.5 ตร.มม.
- รหัสสีสายไฟ: ระบบ 3 เฟส 4 สาย (เฟส A สีแดง, เฟส B สีเหลือง, เฟส C สีน้ำเงิน, นิวทรัลสีฟ้า/เทา,
    สายดินสีเขียวแถบเหลือง)
- ท่อร้อยสายไฟฟ้าโลหะ: ชนิดหนา (RSC) สำหรับฝังดิน/ใต้ถนน, ชนิดหนาปานกลาง (IMC) สำหรับจุดเข้าอาคาร/ที่ชื้น,
    และชนิดบาง (EMT) สำหรับเดินลอยในฝ้าเพดาน
- ตู้ควบคุมไฟฟ้า (Panel Board): ตู้เหล็กหนาไม่น้อยกว่า 1.0 มม. พ่นสีอบ Epoxy บัสบาร์ทองแดงบริสุทธิ์
    เบรกเกอร์ Miniature Circuit Breaker (MCB) ได้มาตรฐาน IEC/UL
- สวิตช์และเต้ารับ: สวิตช์กลไกกระดก Contact เงินแท้ ทนกระแส 10A 250V, เต้ารับชนิดมีกราวด์
    3 ขา (Universal Type) มีม่านนิรภัย (Safety Shutter)
surface_preparation:
- จัดทำแบบ Shop Drawing ตำแหน่งดวงโคม สวิตช์ เต้ารับ วงจรย่อย และแนวท่อร้อยสายไฟรวม
  (Combine Drawing) เสนอขออนุมัติ
- วางท่อร้อยสายไฟ กล่องต่อสาย (Junction Box) และกล่องสวิตช์ก่อนการเทคอนกรีตโครงสร้างหรือก่อนการฉาบปูน
- อุดปิดปลายท่อร้อยสายไฟด้วย Conduit Cap หรือปลั๊กอุด เพื่อป้องกันน้ำปูนและเศษฝุ่นเข้าไปอุดตันภายในท่อ
application_system:
- การเดินท่อร้อยสายไฟต้องดัดโค้งด้วยเครื่องมือดัดท่อ รัศมีดัดไม่น้อยกว่า 6 เท่าของขนาดท่อ
  และมุมดัดรวมไม่เกิน 360 องศาระหว่างกล่องดึงสาย
- ร้อยสายไฟฟ้าหลังจากงานท่อและงานฉาบปูนแห้งสนิทแล้ว ห้ามร้อยสายล่วงหน้าก่อนติดตั้งท่อเสร็จ
- การต่อสายไฟขนาดไม่เกิน 10 ตร.มม. ให้ใช้ Wire Nut หรือขั้วต่อแบบสปริงอัด (Solderless
  Connector) หุ้มฉนวนแน่นหนา การต่อสายต้องทำในกล่องต่อสายเท่านั้น ห้ามต่อสายภายในท่อร้อยสายเด็ดขาด
- ติดตั้งระบบสายดิน (Grounding System) ตอกแท่งกราวด์ร็อด (Ground Rod) ทองแดง ความต้านทานดินต้องไม่เกิน
  5 โอห์ม ตามมาตรฐาน วสท./กฟน.
- การทดสอบระบบ: ทดสอบความต่อเนื่องของวงจร (Continuity Test), วัดค่าความเป็นฉนวนของสายไฟ
    (Insulation Resistance Test) และเปิดทดสอบระบบไฟฟ้าเต็มพิกัดต่อเนื่อง 24 ชั่วโมงก่อนส่งมอบงาน
