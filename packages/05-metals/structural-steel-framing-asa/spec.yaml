id: STRUCTURAL_STEEL_FRAMING_ASA
name: งานโครงสร้างเหล็กและงานโลหะ (Structural Steel Framing and Metal Fabrications
  - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก./JIS
category: metals_structural_steel
masterformat: 05 12 00 - Structural Steel Framing
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 05 12 00 และ 05
    50 00
  tis: มอก. 107-2533 (ท่อเหล็กกลม/เหลี่ยมกลวง), มอก. 1227-2539 (เหล็กโครงสร้างรูปพรรณรีดร้อน),
    มอก. 1288-2538 (เหล็กรูปตัวซีขึ้นรูปเย็น)
  dpt: มาตรฐาน AISC (American Institute of Steel Construction), AWS D1.1 (Structural
    Welding Code - Steel), JIS G3101 SS400, JIS G3459
general_properties:
- เหล็กโครงสร้างรูปพรรณรีดร้อน (H-Beam, I-Beam, Channel, Angle) ชั้นคุณภาพ SM400 ตาม
  มอก. 1227-2539 หรือ SS400 ตาม JIS G3101
- เหล็กรูปพรรณกลวงขึ้นรูปเย็น (ท่อกลม ท่อเหลี่ยมจัตุรัสและผืนผ้า) ชั้นคุณภาพ HS41
  ตาม มอก. 107-2533 และเหล็กรูปตัวซีตาม มอก. 1288-2538
- เหล็กไร้สนิม (Stainless Steel) สำหรับงานราวบันไดและระเบียง ใช้เกรด SUS 316 ตาม JIS
  G3459 พร้อมลวดเชื่อมเกรดเดียวกัน
- สีรองพื้นกันสนิม Red Lead Primer หรือ Zinc Chromate สำหรับเหล็กชุบสังกะสี และสีพ่นกันไฟที่มีเอกสารรับรองการทนไฟไม่น้อยกว่า
  3 ชั่วโมง
- ชิ้นส่วนเหล็กต้องตรง ไม่บิดคดงอ ค่าความเผื่อความตรงไม่เกิน 1 มม. ต่อความยาว 1 เมตร
surface_preparation:
- จัดส่งตัวอย่างเหล็กและผลการทดสอบแรงดึง ยืดตัว และการดัดโค้งจากสถาบันที่เชื่อถือได้ให้ผู้ควบคุมงานอนุมัติ
- จัดทำ Shop Drawing แบบขยายจุดต่อ รอยเชื่อม ระยะโบลท์ และขั้นตอนการประกอบติดตั้ง
- ทำความสะอาดผิวเหล็ก ลอกคราบสนิม น้ำมัน สิ่งสกปรก และสะเก็ดสแลก (Slag) ด้วยการขัดแปรงลวดหรือพ่นทราย
- ปรับระดับฐานรองรับแผ่นเหล็ก (Base Plate) ด้วยนอนชริ้งค์เกราท์ (Non-Shrink Grout)
  ให้ได้ระดับและแนวดิ่งสมบูรณ์
application_system:
- การตัด เจาะ และประกอบชิ้นส่วนเหล็กต้องทำด้วยเครื่องมือกลที่แม่นยำ ระยะคลาดเคลื่อนของความยาวไม่เกิน
  2 มม.
- การต่อเชื่อมโครงสร้างต้องทำโดยช่างเชื่อมที่ผ่านการทดสอบคุณวุฒิ และวิธีการเชื่อมสอดคล้องตามมาตรฐาน
  AWS D1.1
- การยึดต่อด้วยสลักเกลียว (High Strength Bolts) ต้องขันแน่นตามค่าแรงบิดมาตรฐาน AISC
  และตรวจสอบระยะขอบรูเจาะอย่างถูกต้อง
- ทาสีรองพื้นกันสนิมเที่ยวแรกทันทีที่ส่งเหล็กเข้าหน้างาน ทาเที่ยวที่สองหลังประกอบเชื่อมเสร็จ
  และทาซ้ำรอบแนวรอยเชื่อม ทิ้งระยะแห้งตัวอย่างน้อย 6 ชั่วโมงต่อเที่ยว
- ชิ้นส่วนที่สัมผัสหรือฝังในคอนกรีตต้องติดตั้งพุกสลักเกลียว (Anchor Bolts) ร่วมกับการเทคอนกรีตพร้อมวัดระดับอย่างแม่นยำ
