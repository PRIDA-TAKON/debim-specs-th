id: LOUVERS_ASA
name: งานบานเกล็ดระบายอากาศ (Louvers - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: openings_louvers
masterformat: 08 91 00 - Louvers
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 91 00
  tis: มอก. 284-2530 (อลูมิเนียมโครงสร้าง), มอก. 1222-2560 (กระจกแผ่น)
  dpt: มาตรฐาน AMCA 500-L (Laboratory Methods of Testing Louvers for Rating)
general_properties:
- บานเกล็ดอลูมิเนียมทั่วไป: วงกบอลูมิเนียมสี NA ขนาด 50x100 มม. หนาไม่น้อยกว่า 1.5
    มม., ใบเกล็ดอลูมิเนียมตัว Z กว้าง 100 มม. หนาไม่น้อยกว่า 1.5 มม. ระยะห่างเกล็ดไม่เกิน
    50 มม. ชนิดกันฝนสาดเข้าได้ดี
- บานเกล็ดสำเร็จรูป: เกล็ดอลูมิเนียมรูปตัวซี วงรี หรือสี่เหลี่ยม ตามมาตรฐานผู้ผลิต
- บานเกล็ดกระจก: วงกบไม้แดง 50x100 มม. หรืออลูมิเนียม เกล็ดกระจกใสหรือฝ้า หนา 6 มม.
    กว้าง 100 มม. ติดตั้งมุมเอียง 60 องศา หรือชุดบานเกล็ดปรับมุมชนิดมือหมุน
- มุ้งลวดกันแมลง: มุ้งลวดไนลอนสีดำ กรอบอลูมิเนียม ติดตั้งด้านหลังบานเกล็ด ชนิดถอดล้างทำความสะอาดได้
surface_preparation:
- ตรวจสอบช่องเปิดผนังและตำแหน่งติดตั้งให้ตรงตามแบบสถาปัตยกรรมและข้อกำหนดการระบายอากาศของห้องเครื่อง
- ตรวจสอบความพร้อมของระบบกันน้ำฝนสาด เช่น กันสาด ค.ส.ล. หรือครอบอลูมิเนียมรอบช่องบานเกล็ด
- จัดทำ Shop Drawing แสดงรายละเอียดขนาดใบเกล็ด มุมเอียง จุดยึด และมุ้งลวดกันแมลงเพื่อขออนุมัติ
application_system:
- ติดตั้งกรอบวงกบบานเกล็ดเข้ากับผนังหรือโครงสร้างอาคารให้ได้แนวดิ่ง ฉาก และมั่นคงแข็งแรง
- ประกอบใบเกล็ดเข้ากับโครงสร้างตามมุมองศาและระยะห่างที่กำหนด ยึดด้วยสกรูสแตนเลสอย่างแน่นหนา
- ติดตั้งมุ้งลวดกันแมลงด้านในบานเกล็ดให้แนบสนิทรอบกรอบ เพื่อป้องกันแมลงและสัตว์เลื้อยคลาน
- ยาแนวรอยต่อระหว่างวงกบบานเกล็ดกับผนังปูนฉาบภายนอกด้วยซิลิโคนกันน้ำชนิด Non-Staining
  ป้องกันน้ำรั่วซึม
- ตรวจสอบการระบายอากาศและการกันฝนสาด พร้อมทำความสะอาดใบเกล็ดและรางระบายน้ำให้เรียบร้อย
