id: DOOR_AND_WINDOW_HARDWARE_ASA
name: อุปกรณ์ประกอบประตูและหน้าต่าง (Door and Window Hardware - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตฮาร์ดแวร์มาตรฐานสากล
category: openings_hardware
masterformat: 08 71 00 - Door Hardware
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 71 00 และ 08
    75 00
  tis: มอก. 756-2531 (กุญแจลูกบิดติดประตู)
  dpt: มาตรฐาน ANSI/BHMA A156 Series, UL Listed
general_properties:
- กุญแจลูกบิด (Cylindrical Lock): ไส้กุญแจทองเหลืองแท้ 6 พิน (Solid Brass 6-Pin Cylinder)
    หัวลูกบิดและจานรองทำจากสแตนเลส SUS 304 รองรับระบบ Master Key
- กุญแจลิ้นตาย (Deadbolt Lock): ลิ้นล็อกทำจากเหล็กกล้าชุบแข็ง (Hardened Steel Roller)
    ยาว 25 มม. (1 นิ้ว) ป้องกันการตัดเลื่อย
- บานพับสแตนเลส: ประตูไม้ใช้ขนาด 100x75x2.5 มม. พร้อมแหวนสแตนเลส 4 แหวน, ประตูเหล็กใช้บานพับสวมสแตนเลส
    100x125x3 มม.
- อุปกรณ์เปิดค้างและโช้คอัพ (Door Closer): ชนิดติดบนบานกรอบหรือฝังพื้น (Floor Hinge)
    มีระบบควบคุมความเร็วการปิดสองจังหวะ
- อุปกรณ์บานเลื่อนและบานเฟี้ยม: ล้อเลื่อน Nylon คุณภาพสูงพร้อมตลับลูกปืน (Ball Bearing)
    รางแขวนอลูมิเนียมหนาพิเศษ และไกด์รางล่าง (Guide Rail)
- อุปกรณ์เสริม: กันชนประตูสแตนเลสพร้อมยางซับเสียง, กลอนฝังสแตนเลสบน-ล่าง 6 นิ้ว, และแถบยางกันฝน
    (Weather Strip)
surface_preparation:
- จัดทำตารางฮาร์ดแวร์ (Hardware Schedule) ระบุฟังก์ชันการใช้งานของแต่ละห้อง พร้อมผังระบบกุญแจ
  Master Key ส่งขออนุมัติ
- ตรวจสอบความพร้อมของบานประตู วงกบ ความหนา และทิศทางการเปิด-ปิดของบาน ให้ตรงกับชนิดของอุปกรณ์
- กำหนดระยะตำแหน่งติดตั้งที่แน่นอน เจาะรูและบากช่องด้วยเครื่องมือเฉพาะทางอย่างประณีต
application_system:
- ติดตั้งบานพับให้ได้แนวดิ่งตรงกัน โดยตำแหน่งบานพับบนห่างขอบบนประมาณ 15-20 ซม., บานพับล่างห่างขอบล่าง
  20-25 ซม., บานพับกลางอยู่กึ่งกลาง
- ติดตั้งกลอน มือจับ และกุญแจด้วยสกรูสแตนเลสหัวฝังเรียบ ขันแน่นตรงจุด ห้ามตอกตะปูแทนสกรูเด็ดขาด
- ระหว่างการก่อสร้างให้ใช้กุญแจชั่วคราว (Construction Keying) และเปลี่ยนเป็นชุดลูกกุญแจจริง
  Master Key ชุดละ 3 ดอกในวันส่งมอบงาน
- ติดตั้งกันชนประตู (Door Stopper) ในตำแหน่งที่เหมาะสมเพื่อป้องกันมือจับกระแทกผนังหรือกระจกชำรุด
- ทดสอบการทำงานของอุปกรณ์ทุกชิ้น การล็อก การคืนตัวของโช้คอัพ และการเปิด-ปิดอย่างนุ่มนวลก่อนส่งมอบงาน
