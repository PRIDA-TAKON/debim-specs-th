id: ALUMINIUM_DOORS_AND_WINDOWS_ASA
name: งานประตูและหน้าต่างอลูมิเนียม (Aluminium Doors and Windows - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: openings_aluminium
masterformat: 08 11 16 - Aluminium Doors and Frames
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 11 16 และ 08
    51 13
  tis: มอก. 284-2530 (โครงอลูมิเนียมสำหรับงานอาคาร), มอก. 829-2531 (ประตูหน้าต่างอลูมิเนียม)
  dpt: มาตรฐาน ASTM B221 (Aluminum Alloy 6063 T5), AAMA Standards
general_properties:
- เส้นอลูมิเนียมอัลลอยด์ Alloy 6063 T5 มีกำลังดึงประลัย (Ultimate Tensile Strength)
  ไม่น้อยกว่า 151.7 MPa (22,000 psi)
- ผิวอลูมิเนียมชุบอโนไดซ์ (Anodized) มีความหนาฟิล์มไม่น้อยกว่า 15 ไมครอน (±2 ไมครอน)
  หรือพ่นสีผงอบความร้อน (Powder Coating)
- สกรูยึดวงกบและบานกรอบทั้งหมดต้องเป็นสแตนเลสสตีล SUS 304 ไม่เป็นสนิม
- ยางอัดกระจกชนิด Neoprene หรือ EPDM ทนความร้อนและรังสี UV พร้อมสักหลาด (Wool Pile)
  ชนิดมีแถบกันน้ำรอบกรอบบาน
- ยาแนวภายนอกด้วยซิลิโคนชนิด Non-Staining ไม่ทิ้งคราบสกปรกบนกระจกและอลูมิเนียม
surface_preparation:
- วัดขนาดช่องเปิดจริงจากหน้างานภายหลังหล่อเสาเอ็น คานทับหลัง และจับเซี้ยมฉาบปูนเสร็จเรียบร้อย
- ตรวจสอบช่องเปิดต้องได้แนวดิ่ง ฉาก และระนาบ โดยเว้นระยะห่างรอบวงกบด้านละประมาณ 5
  มม. สำหรับยาแนว
- ทำความสะอาดช่องเปิด ปราศจากคราบปูน น้ำมัน และฝุ่นละออง
- จัดทำ Shop Drawing แสดงหน้าตัดโปรไฟล์ ความหนา รายละเอียดจุดต่อ รอยต่อกันน้ำ และการรับแรงลม
application_system:
- ประกอบบานกรอบและวงกบอลูมิเนียมด้วยความประณีต อัดซิลิโคนกันน้ำที่รอยต่อมุมโปรไฟล์ทุกจุด
- ติดตั้งวงกบเข้ากับเสาเอ็น ค.ส.ล. ด้วยพุกเหล็กและสกรูสแตนเลส ระยะห่างไม่เกิน 500
  มม. ให้มั่นคงแข็งแรง
- เซาะร่องปูนฉาบรอบวงกบ 5x3 มม. อุดด้วยวัสดุยาแนวกันน้ำพร้อมเส้นโฟมหนุน (Backer Rod)
- ติดตั้งกระจก ยางอัดกระจก EPDM และยาแนวรอยต่อด้วยซิลิโคนสีเดียวกับอลูมิเนียมอย่างประณีตเรียบเนียน
- พ่นเคลือบฟิล์มกันรอย Strippable PVC Coating เพื่อปกป้องผิวอลูมิเนียมตลอดระยะเวลาก่อสร้าง
- ทดสอบการเปิด-ปิด และทดสอบการรั่วซึมของน้ำฝน (Water Leakage Test) ด้วยการฉีดน้ำแรงดันสูงตามมาตรฐาน
