id: WOOD_DOORS_AND_WINDOWS_ASA
name: งานประตูและหน้าต่างไม้ (Wood Doors and Windows - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: openings_wood_doors
masterformat: 08 14 00 - Wood Doors
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 14 00 และ 08
    52 00
  tis: มอก. 178-2549 (แผ่นไม้อัด), มอก. 192-2549 (ไม้แปรรูป)
  dpt: มาตรฐานกรมป่าไม้ กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม
general_properties:
- วงกบไม้แดงขนาด 50x100 มม. (2x4 นิ้ว) สำหรับประตูทั่วไป, ขนาด 50x125 มม. (2x5 นิ้ว)
  สำหรับห้องน้ำ และบานเลื่อน/มุ้งลวดใช้ 50x150 มม. (2x6 นิ้ว) พร้อมบังใบ 10 มม.
- บานกรอบประตูและหน้าต่างไม้จริง ทำจากไม้สักเกรด A อบแห้ง ประกอบสำเร็จจากโรงงาน หนาไม่น้อยกว่า
  35 มม.
- บานประตูไม้อัด ใช้ไม้อัดเกรดภายนอก (Exterior Grade) หนา 35 มม. ไส้ไม้แน่น ปิดขอบไม้จริงรอบบาน
- ไม้ต้องอบแห้งสนิท มีความชื้นไม่เกินเกณฑ์ ปราศจากตามอด ตาผุ รอยแตก รอยต่อสนิทแน่น
  ไม่บิดงอ
- กรอบมุ้งลวดไม้สัก ขนาด 37.5x125 มม. ขึงมุ้งลวดไนลอนสีดำตึงเรียบสม่ำเสมอ
surface_preparation:
- ทาแชลแล็กขาวรองพื้นวงกบไม้ 1 ครั้งก่อนนำเข้าติดตั้ง เพื่อป้องกันน้ำปูนและความชื้นทำลายเนื้อไม้
- เซาะร่องหลังวงกบกว้าง 20 มม. ลึก 10 มม. ตลอดแนว เพื่อการยึดเหนี่ยวกับคอนกรีตเสาเอ็นและทับหลัง
- ตรวจสอบช่องเปิดและขนาดวงกบให้ได้ดิ่ง ฉาก และระนาบ โดยบานประตูภายนอกต้องมีธรณีประตูบังใบกันฝนสาดสูง
  20 มม.
- เก็บรักษาบานประตู-หน้าต่างไม้ในที่แห้ง มีหลังคาคลุม วางในแนวตั้ง ไม่อยู่ในที่ชื้นหรือโดนแดดฝนสาด
application_system:
- ติดตั้งวงกบไม้พร้อมการหล่อเสาเอ็นและคานทับหลัง ค.ส.ล. รัดรอบวงกบ โดยมีค้ำยันยึดตรึงป้องกันวงกบแอ่นคด
- ติดตั้งบานเข้ากับวงกบโดยเว้นช่องว่างโดยรอบบานประมาณด้านละ 2 มม. เพื่อการยืดหดตัวตามธรรมชาติ
- ติดตั้งบานพับสแตนเลสมีแหวน 4 แหวน ขนาด 4x3 นิ้ว บานละ 3 ตัวสำหรับประตู และบานละ
  2 ตัวสำหรับหน้าต่าง
- เจาะติดตั้งลูกบิดที่ความสูง 1.00 ม. จากพื้นตกแต่งถึงกึ่งกลางลูกบิด เมื่อทดสอบการเปิด-ปิดเรียบร้อยแล้ว
  ให้ถอดอุปกรณ์เก็บใส่กล่องก่อนส่งช่างทาสี
- เซาะร่องรอยต่อวงกบไม้กับผนังปูนฉาบ 5x3 มม. ทั้งภายนอกและภายใน อุดด้วยยาแนวอะคริลิกชนิดทาสีทับได้
- ทาสีย้อมเนื้อไม้และสารรักษาเนื้อไม้ตามมาตรฐานงานทาสี ก่อนติดตั้งอุปกรณ์กลับคืนและปรับแต่งส่งมอบงาน
