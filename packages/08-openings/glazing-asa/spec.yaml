id: GLAZING_ASA
name: งานกระจกและวัสดุติดตั้งกระจก (Glazing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตกระจกมาตรฐาน มอก.
category: openings_glazing
masterformat: 08 80 00 - Glazing
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 80 00
  tis: มอก. 1222-2560 (กระจกโฟลต), มอก. 965-2537 (กระจกนิรภัยเทมเปอร์), มอก. 1223-2537
    (กระจกนิรภัยลามิเนต)
  dpt: มาตรฐาน ASTM C1036 (Flat Glass), ASTM C1048 (Heat-Treated Flat Glass)
general_properties:
- กระจกโฟลต (Float Glass): ผิวเรียบขนานสม่ำเสมอ ภาพสะท้อนคมชัด ไม่หลอกตา ปราศจากฟองอากาศ
    รอยขูดขีด หรือฝ้ามัว
- กระจกนิรภัยเทมเปอร์ (Tempered Glass): หนา 12 มม. สำหรับประตูกระจกเปลือย ไร้กรอบ
    ทนต่อแรงกระแทกและแรงดันลม
- กระจกนิรภัยลามิเนต (Laminated Glass): กระจกสองชั้นประกบด้วยฟิล์ม PVB หนาไม่น้อยกว่า
    3+0.76+3 มม. สำหรับผนังกระจกภายนอกอาคารสูงตามกฎหมายควบคุมอาคาร
- เกณฑ์ความหนากระจกทั่วไป: บานหน้าต่าง/ประตู/ช่องแสงติดตาย ขนาดไม่เกิน 2.0 ตร.ม. หนาไม่น้อยกว่า
    6 มม., บานเจียรขอบหนา 8 มม., ขนาดเกิน 2.0 ตร.ม. หนาไม่น้อยกว่า 8 มม.
- วัสดุยาแนวกระจก: ซิลิโคนยาแนวชนิด Neutral Cure ทนสภาพอากาศ UV ไม่หดตัว และไม่ทิ้งคราบสกปรก
    (Non-Staining)
surface_preparation:
- ตรวจสอบขนาดบานกรอบ ช่องใส่กระจก และร่องรับกระจกให้ได้แนวระนาบ ดิ่ง และฉาก
- ขอบกระจกที่ตัดแล้วทุกแผ่นต้องเจียรลบมุมคม (Seamed/Polished Edge) เพื่อป้องกันการแตกร้าวจากความเค้นและการบาดเจ็บ
- ทำความสะอาดร่องกรอบบานและขอบกระจก ขจัดฝุ่น น้ำมัน และความชื้นให้แห้งสนิทก่อนลงวัสดุยาแนว
- ติดตั้งบล็อกรองรับกระจก (Setting Blocks) ชนิดยาง Neoprene หรือ EPDM ที่ก้นร่องในตำแหน่งที่ถูกต้อง
application_system:
- วางแผ่นกระจกลงบน Setting Blocks จัดระยะห่างระหว่างขอบกระจกกับกรอบบานให้ได้ศูนย์กลางสม่ำเสมอทุกด้าน
- ใส่ยางอัดกระจก (Gasket) หรือฉีดซิลิโคนยาแนวประกบทั้งสองด้านให้เต็มร่อง ปาดแต่งแนวรอยต่อให้เรียบเนียนสม่ำเสมอ
- ห้ามติดตั้งกระจกขณะที่สีทากรอบบานยังไม่แห้งสนิท หรือขณะฝนตกสภาพอากาศมีความชื้นสูง
- ติดสัญลักษณ์เตือนบนผืนกระจกใสเพื่อความปลอดภัยในเขตก่อสร้าง และทำความสะอาดคราบยาแนวทันทีก่อนแห้งตัว
- ก่อนส่งมอบงาน ทำความสะอาดกระจกทั้งสองด้านให้ใสสะอาด ปราศจากคราบสี รอยขูดขีด หรือสิ่งสกปรก
