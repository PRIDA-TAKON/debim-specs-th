id: METAL_DOORS_AND_FRAMES_ASA
name: งานประตูและวงกบเหล็ก (Metal Doors and Frames - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐานสากล
category: openings_metal_doors
masterformat: 08 11 00 - Metal Doors and Frames
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 08 11 00
  tis: มอก. 244-2551 (ประตูเหล็ก)
  dpt: มาตรฐาน NFPA 80 (Standard for Fire Doors), UL 10C (Fire Tests of Door Assemblies)
general_properties:
- บานประตูเหล็กผลิตจากแผ่นเหล็กหนาไม่น้อยกว่า 1.0 มม. เคลือบสารฟอสเฟต (Zinc Phosphate)
  และพ่นสีผงอบความร้อน Polyester Powder Coating จากโรงงาน
- วงกบเหล็กพับขึ้นรูป หนาไม่น้อยกว่า 1.6 มม. พ่นเคลือบสีอบชนิดเดียวกับตัวบาน
- ประตูกันไฟ (Fire Rated Door) ทนไฟและควันได้ไม่น้อยกว่า 3 ชั่วโมง บานหนาไม่น้อยกว่า
  1.6 มม. ภายในบุกระดาษรังผึ้งหรือใยหิน Rockwool พร้อมยางกันควันรอบบาน และคานผลักหนีไฟ
  Panic Exit Device
- ประตูเหล็กม้วน: แบบมือดึง (กว้างไม่เกิน 4 ม. สูงไม่เกิน 3 ม. น้ำหนักไม่เกิน 120
    กก.) หรือแบบโซ่/มอเตอร์ไฟฟ้า ใบม้วนลอนเดี่ยวหนา 0.7-0.9 มม.
- อุปกรณ์ประกอบ: บานพับสวมสแตนเลส 4x5 นิ้ว หนา 3 มม., กุญแจลูกบิดสแตนเลส 6 พิน ระบบ
    Master Key, และโช้คอัพประตู (Door Closer)
surface_preparation:
- ตรวจสอบขนาดช่องเปิด ความกว้าง ความสูง และระดับพื้นตกแต่งจริงให้ถูกต้องตรงตาม Shop
  Drawing
- ตรวจเช็คการติดตั้งเหล็กหนวดกุ้งและเสาเอ็น คานทับหลัง ค.ส.ล. บริเวณช่องเปิด เพื่อความแข็งแรงในการยึดวงกบ
- จัดส่งชิ้นส่วนตัวอย่าง บาน วงกบ และอุปกรณ์ประกอบให้ผู้ควบคุมงานตรวจสอบอนุมัติก่อนสั่งผลิต
application_system:
- ติดตั้งวงกบเหล็กให้ได้แนวดิ่ง ฉาก และระนาบ ยึดติดกับเสาเอ็นและคานทับหลังด้วยพุกเหล็กและรอยเชื่อมอย่างมั่นคงแข็งแรง
- หยอดมอร์ต้าปูนทรายในโพรงวงกบเหล็กให้เต็มแน่น เพื่อเสริมความแข็งแกร่งและป้องกันเสียงก้อง
- รอยต่อรอบวงกบเหล็กส่วนที่แนบกับผนังปูนฉาบ ให้เซาะร่องขนาด 6x3 มม. แล้วอุดด้วยวัสดุยาแนวชนิดทาสีทับได้
- ติดตั้งบานประตู ปรับตั้งช่องว่างโดยรอบบานให้ได้มาตรฐานสม่ำเสมอประมาณ 2-3 มม.
- ติดตั้งอุปกรณ์บานพับ โช้คอัพ คานผลักหนีไฟ และกุญแจ พร้อมทดสอบการเปิด-ปิดให้ทำงานได้นุ่มนวลและสนิทแน่น
