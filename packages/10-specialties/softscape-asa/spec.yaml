id: SOFTSCAPE_ASA
name: งานต้นไม้และภูมิทัศน์ (Softscape - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: specialties_softscape
masterformat: 10 99 11 - Softscape
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 10 99 11
  tis: มาตรฐานกรมวิชาการเกษตร กระทรวงเกษตรและสหกรณ์
  dpt: มาตรฐานสมาคมภูมิสถาปนิกประเทศไทย (TALA)
general_properties:
- ไม้ยืนต้น ไม้พุ่ม ไม้เลื้อย และหญ้า ต้องมีรูปทรงสมบูรณ์ แข็งแรง ลำต้นตรง ยอดเดี่ยวไม่หัก
  ปราศจากโรคพืชและแมลงศัตรูพืช
- ต้นไม้ที่ขุดย้ายต้องมีตุ้มดินขนาดใหญ่เป็น 6 เท่าของขนาดลำต้น และความสูงของตุ้มดินเป็น
  2 ใน 3 ของความกว้าง รากไม่ฉีกขาด ตุ้มดินไม่แตก
- ต้นไม้ต้องผ่านการพักฟื้นและฝึกลดแสง (Hardening) ให้คุ้นกับสภาพแสงจริงไม่น้อยกว่า
  6 สัปดาห์
- ดินปลูกผสม: ดินบน (pH 6.5) 2 ส่วน, ปุ๋ยคอกหมัก 2 ส่วน, ทรายหยาบ/เปลือกถั่ว 1 ส่วน
    ปราศจากเศษขยะมูลฝอยและสารเคมีตกค้าง
- แผ่นหญ้าขนาด 500x1000 มม. สีเขียวสด ดินติดแผ่นสม่ำเสมอ ไม่ขาดรุ่ย หรือแห้งเหลือง
surface_preparation:
- ปรับระดับผิวดินเดิม กำจัดเศษวัสดุก่อสร้าง หิน วัชพืช และรากไม้ออกให้หมด
- พรวนดินลึก 150 มม. บดอัดด้วยลูกกลิ้งความแน่น 50-60% Modified Proctor Density ปรับผิวดินให้เรียบเนียน
- ขุดหลุมปลูกตามขนาดที่ระบุในแบบ ดินก้นหลุมที่เป็นเศษก่อสร้างต้องขนย้ายออกไปทิ้งนอกบริเวณ
- ตรวจสอบระบบระบายน้ำใต้ดิน ติดตั้งแผ่นใยกรอง Geocomposite หรือแผ่นใยมะพร้าวป้องกันดินอุดตันท่อระบายน้ำ
application_system:
- การปลูกไม้ยืนต้น: แกะกระสอบหุ้มตุ้มดินด้วยความระมัดระวัง วางต้นไม้ลงกึ่งกลางหลุม
    ตั้งลำต้นให้ตรงแนว เติมดินผสมรอบตุ้มทีละ 150 มม. กระทุ้งพอแน่น แล้วรดน้ำให้ชุ่มโชก
- ติดตั้งไม้ค้ำยันต้นไม้ (Tree Staking) ทันทีหลังปลูก ยึดผูกต้นไม้ด้วยวัสดุนิ่มป้องกันเปลือกถลอก
- การปูหญ้า: รดน้ำผิวดินให้ชื้น ปูแผ่นหญ้าชนชิดสนิทเหลื่อมแนวกัน ใช้ลูกกลิ้งบดอัดให้หญ้าแนบสนิทกับผิวดิน
    และรดน้ำตามทันที
- การดูแลรักษา: รดน้ำวันละ 2 ครั้งในสัปดาห์แรก และวันละ 1 ครั้งต่อเนื่อง ตัดหญ้า ใส่ปุ๋ย
    และถอนวัชพืชสม่ำเสมอ รับประกันดูแลรักษางานภูมิทัศน์ไม่น้อยกว่า 120 วัน
