id: CONCRETE_REINFORCING_ASA
name: งานเหล็กเสริมคอนกรีต (Concrete Reinforcing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: concrete_reinforcing
masterformat: 03 20 00 - Concrete Reinforcing
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 03 20 00
  tis: มอก. 20-2543 (เหล็กเส้นกลม), มอก. 24-2548 (เหล็กข้ออ้อย), มอก. 138-2535 (ลวดผูกเหล็ก)
  dpt: มาตรฐานอาคารคอนกรีตเสริมเหล็กโดยวิธีหน่วยแรงใช้งาน วสท. 1014-46, AWS D1.4
general_properties:
- เหล็กเส้นกลม (Round Bars) ชั้นคุณภาพ SR-24 สำหรับขนาดเส้นผ่านศูนย์กลาง 6 ถึง 9 มม.
  ผิวเรียบเกลี้ยง ขนาดสม่ำเสมอตลอดเส้น ตาม มอก. 20-2543
- เหล็กข้ออ้อย (Deformed Bars) ชั้นคุณภาพ SD-40 สำหรับขนาดเส้นผ่านศูนย์กลางตั้งแต่
  12 ถึง 32 มม. บั้งครีบสม่ำเสมอ ผิวสะอาด ตาม มอก. 24-2548
- ลวดผูกเหล็กต้องเป็นลวดเหล็กอบอ่อนเบอร์ 18 SWG (Annealed Iron Wire) เหนียว ผูกง่าย
  ไม่ขาดเปราะง่าย ตาม มอก. 138-2535
- เหล็กเสริมต้องเป็นเหล็กใหม่ ไม่เคยผ่านการใช้งาน ปราศจากสนิมขุม น้ำมัน จาระบี คราบโคลน
  หรือรอยแตกร้าว และห้ามนำเหล็กรีดซ้ำ (SRR) มาใช้เด็ดขาด
surface_preparation:
- การเก็บรักษาเหล็กเสริมต้องยกกองเก็บเหนือพื้นดินไม่น้อยกว่า 300 มม. มีหลังคาคลุมป้องกันน้ำค้าง
  น้ำฝน และสิ่งสกปรก
- จัดแยกกองเหล็กตามขนาด ชั้นคุณภาพ และรุ่นที่ส่งเข้าหน้างาน พร้อมสุ่มตัดตัวอย่างส่งทดสอบกำลังดึงและดัดโค้ง
  ณ สถาบันที่เชื่อถือได้
- ทำความสะอาดผิวเหล็กเสริมก่อนนำไปติดตั้ง ขจัดคราบสนิม น้ำมัน โคลน หรือสารเคลือบผิวที่อาจทำลายแรงยึดเหนี่ยวระหว่างเหล็กกับคอนกรีต
application_system:
- การตัดและดัดเหล็กต้องทำตามขนาดและรูปร่างในแบบ โดยใช้วิธีดัดงอเย็น (Cold Bending)
  รัศมีของงอต้องเป็นไปตามมาตรฐาน วสท.
- การต่อทาบเหล็กเส้น: เหล็กเส้นกลมระยะทาบไม่น้อยกว่า 48 เท่าของเส้นผ่านศูนย์กลาง,
    เหล็กข้ออ้อยไม่น้อยกว่า 36 เท่า และต้องไม่น้อยกว่า 300 มม. มัดด้วยลวดผูกเหล็กทุกระยะ
    100 มม.
- การต่อเชื่อมเหล็กเส้นขนาดตั้งแต่ 25 มม. ขึ้นไป ต้องใช้วิธีเหลาปลายดินสอและเชื่อมชนด้วยไฟฟ้า
  โดยกำลังรอยเชื่อมต้องไม่น้อยกว่า 125% ของกำลังเหล็ก
- ตำแหน่งรอยต่อเหล็กเสริม: คานให้ต่อเหล็กบนที่กลางคาน เหล็กล่างต่อที่หน้าเสาถึง L/5,
    เสาให้ต่อเหนือระดับพื้น 1.00 ม. ถึงกึ่งกลางความสูง และห้ามต่อเหล็กเสริมในคานยื่นและฐานรากเด็ดขาด
- หนุนลูกปูนมอร์ต้า (อัตราส่วนซีเมนต์ 1: ทราย 1) หรือขาเก้าอี้เหล็ก เพื่อรักษาระยะคอนกรีตหุ้มเหล็ก
    (Covering) และจัดช่องว่างระหว่างผิวเหล็ก (Clear Distance) 25-40 มม.
- จัดทำทางเดินชั่วคราวเหนือเหล็กเสริมพื้น เพื่อป้องกันคนงานเหยียบย่ำให้เหล็กแอ่นตัวเสียรูปก่อนและระหว่างการเทคอนกรีต
