id: CONCRETE_CURING_ASA
name: การบ่มคอนกรีต (Concrete Curing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA)
category: concrete_curing
masterformat: 03 39 00 - Concrete Curing
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 03 39 00
  tis: มอก. 15 เล่ม 1-2547 (ปูนซีเมนต์ปอร์ตแลนด์)
  dpt: มาตรฐาน วสท. 1014-46, ACI 308R
general_properties:
- การป้องกันคอนกรีตสดในระยะกำลังแข็งตัวจากอันตรายอันเกิดจากแสงแดด ลมแรง ฝนตก น้ำไหล
  น้ำเซาะ และแรงกระแทก
- การรักษาความชื้นต่อเนื่องเพื่อให้ปฏิกิริยาไฮเดรชันสมบูรณ์ พัฒนากำลังอัดสูงสุด และป้องกันการแตกร้าวจากการหดตัวแบบพลาสติก
  (Plastic Shrinkage)
- วัสดุสำหรับการบ่ม: กระสอบป่านสะอาด ผ้าใบพลาสติก น้ำสะอาด หรือน้ำยาบ่มคอนกรีตที่ผ่านการรับรองจากวิศวกรผู้ออกแบบ
surface_preparation:
- เริ่มเตรียมการบ่มทันทีที่ผิวหน้าคอนกรีตเซ็ตตัวพอรับน้ำหนักวัสดุคลุมได้โดยไม่เกิดรอยบุ๋มหรือรอยตำหนิ
- จัดเตรียมแหล่งน้ำสะอาด แรงดันน้ำเพียงพอ และอุปกรณ์ฉีดพ่นฝอยละอองน้ำล่วงหน้าก่อนการเทคอนกรีต
- ตรวจสอบสภาพผิวคอนกรีตแนวราบและแนวดิ่งให้ปราศจากสิ่งสกปรกก่อนเข้าสู่วิธีการบ่ม
application_system:
- สำหรับคอนกรีตที่ใช้ปูนซีเมนต์ปอร์ตแลนด์ประเภทหนึ่ง ต้องรักษาความชื้นต่อเนื่องกันเป็นเวลาไม่น้อยกว่า
  7 วันเต็ม
- การบ่มผิวพื้นแนวราบ: ใช้วิธีขังน้ำ (Ponding), คลุมด้วยกระสอบหรือผ้าใบเปียกชื้นตลอดเวลา,
    หรือฉีดพ่นละอองน้ำเป็นระยะไม่ให้ผิวแห้ง
- การบ่มผิวแนวตั้ง (เสา ผนัง คาน): ให้หุ้มด้วยกระสอบหรือผ้าใบให้เหลื่อมซ้อนกัน และรดน้ำรักษาความชื้นให้แนบติดผิวคอนกรีตตลอด
    7 วัน หรือคงแบบหล่อไว้ตามเกณฑ์
- กรณีใช้สารเคมีหรือน้ำยาเคลือบผิวบ่มคอนกรีต (Curing Compound) ต้องพ่นให้สม่ำเสมอเต็มพื้นที่ตามอัตราส่วนของผู้ผลิต
  และต้องไม่ขัดขวางการยึดเกาะของงานฉาบแต่ง
