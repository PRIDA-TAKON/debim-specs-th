id: CAST_IN_PLACE_CONCRETE_ASA
name: งานคอนกรีตเทในที่ (Cast-in-Place Concrete - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: concrete_cast_in_place
masterformat: 03 30 00 - Cast-in-Place Concrete
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 03 30 00
  tis: มอก. 15 เล่ม 1-2547 (ปูนซีเมนต์ปอร์ตแลนด์), มอก. 213-2520 (คอนกรีตผสมเสร็จ),
    มอก. 409-2525 (การทดสอบความต้านแรงอัด), มอก. 566-2528 (มวลผสมคอนกรีต)
  dpt: มาตรฐาน วสท. 1014-46, ASTM C143 (Slump Test), ASTM C42 (Drilled Cores)
general_properties:
- ปูนซีเมนต์ปอร์ตแลนด์ประเภทหนึ่งตาม มอก. 15 เล่ม 1-2547 แห้งสนิท ไม่จับตัวเป็นก้อน
- มวลรวมหยาบและมวลรวมละเอียดสะอาด แข็งแกร่ง ขนาดคละถูกต้องตามเกณฑ์ มอก. 566-2528 ปราศจากสารอินทรีย์
  ดิน หรือด่าง
- น้ำผสมคอนกรีตต้องสะอาด ปราศจากน้ำมัน กรด ด่าง เกลือ หรือสารเจือปนที่เป็นอันตรายต่อคอนกรีตและเหล็กเสริม
- กำลังรับแรงอัดของคอนกรีตโครงสร้าง ค.ส.ล. ต้องไม่น้อยกว่า 240 ksc (ทรงกระบอกมาตรฐาน
  15x30 ซม. ที่อายุ 28 วัน)
- ค่ายุบตัว (Slump) ตาม ASTM C143: แผ่นพื้น คาน ผนัง ค.ส.ล. และฐานราก อยู่ระหว่าง
    40-100 มม., เสา 50-100 มม., พื้นอัดแรง 50-130 มม.
surface_preparation:
- ตรวจสอบความมั่นคงแข็งแรงของแบบหล่อ แนวระดับ และการจัดวางเหล็กเสริมพร้อมลูกปูนหนุนให้ครบถ้วนถูกต้อง
- ติดตั้งท่อร้อยสายไฟ ท่อประปา ปลอกท่อ (Sleeve) และอุปกรณ์ฝังยึด (Inserts) ให้เรียบร้อยในตำแหน่งที่กำหนด
- ทำความสะอาดภายในแบบหล่อ ฉีดล้างเศษผง ขี้เลื่อย และระบายน้ำขังออกให้หมด
- ก่อนเทคอนกรีตทับรอยต่อเดิม (Construction Joint) ต้องสกัดเปิดผิวหยาบ ขจัดฝ้าน้ำปูน
  พรมน้ำให้ชุ่มชื้นแต่ไม่ขังแฉะ แล้วไล้ด้วยปูนทรายอัตราส่วน 1:1
application_system:
- การผสมคอนกรีตต้องใช้เครื่องผสมที่ผ่านการรับรอง หรือใช้คอนกรีตผสมเสร็จตาม มอก. 213-2520
  ห้ามเติมน้ำเพื่อเพิ่มค่ายุบตัวที่หน้างานเด็ดขาด
- การลำเลียงและการเทต้องต่อเนื่อง ป้องกันการแยกตัวของมวลรวม โดยห้ามทิ้งคอนกรีตดิ่งสูงเกินกว่า
  2.00 เมตร
- การทำให้แน่นต้องใช้เครื่องเขย่าคอนกรีต (Vibrator) จุ่มในแนวดิ่งระยะห่างจุดละประมาณ
  50 ซม. นาน 5-15 วินาทีต่อจุด จนคอนกรีตแน่นรอบเหล็กเสริม ห้ามใช้เครื่องจี้ลากคอนกรีต
- ต้องหล่อก้อนตัวอย่างทดสอบแรงอัดทุกครั้งที่มีการเทโครงสร้างหลัก เพื่อนำไปบ่มและทดสอบตาม
  มอก. 409-2525
- คอนกรีตที่เริ่มก่อตัวแล้วหรือเกิน 30 นาทีหลังออกจากเครื่องผสม (หรือ 1 ชั่วโมงกรณีรถผสมกวนตลอดเวลา)
  ห้ามนำมาเทหรือผสมใช้ต่อเด็ดขาด
