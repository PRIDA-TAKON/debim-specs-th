id: PRECAST_HOLLOW_CORE_PLANK_ASA
name: งานพื้นคอนกรีตสำเร็จรูป (Precast Concrete Hollow Core Planks - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: concrete_precast
masterformat: 03 41 13 - Precast Concrete Hollow Core Planks
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 03 41 13
  tis: มอก. 576-2546 (แผ่นคอนกรีตเสริมเหล็กอัดแรงหล่อสำเร็จสำหรับระบบพื้น), มอก. 828-2531
    (ชิ้นส่วนคอนกรีตเสริมเหล็กอัดแรงหล่อสำเร็จสำหรับระบบพื้นประกอบ)
  dpt: มาตรฐาน วสท. 1014-46
general_properties:
- แผ่นพื้นคอนกรีตอัดแรงหล่อสำเร็จแบบตัน (Planks) ต้องได้มาตรฐาน มอก. 576-2546 หรือแบบกลวง
  (Hollow Core) ต้องได้มาตรฐาน มอก. 828-2531
- ผิวท้องแผ่นคอนกรีตต้องเรียบสม่ำเสมอ ไม่บิ่น แตก ร้าว และไม่โก่งงอแตกต่างกันระหว่างแผ่นจนปรากฏเห็นชัดเจนเมื่อติดตั้ง
- ความสามารถในการรับน้ำหนักบรรทุกจร (Live Load) ต้องไม่น้อยกว่าค่าที่ระบุในแบบคำนวณโครงสร้าง
- คอนกรีตเททับหน้า (Topping) หนาไม่น้อยกว่า 50 มม. เสริมเหล็กตะแกรง wire mesh หรือเหล็กเส้นตามแบบ
  โดยกำลังอัดคอนกรีตทับหน้าไม่ต่ำกว่า 240 ksc
surface_preparation:
- ตรวจสอบระดับหลังคานรับแผ่นพื้น ค.ส.ล. หากระดับต่ำเกินไปให้ปรับแต่งด้วยปูนทรายหรือคอนกรีตเสริมเหล็ก
  ห้ามใช้อิฐมอญก่อเสริมใต้คานเด็ดขาด
- ทำความสะอาดหลังคาน ขจัดเศษปูน ฝุ่น และสิ่งสกปรก พร้อมตรวจสอบระยะถ่ายน้ำหนักและแนววางแผ่นพื้น
- การกองเก็บแผ่นพื้นสำเร็จรูปในหน่วยงาน ต้องใช้ไม้หมอนหนุนตรงตำแหน่งหูยกหรือจุดรองรับที่ถูกต้องตามคำแนะนำของผู้ผลิต
application_system:
- การเรียงแผ่นพื้นบนคานต้องวางปลายแผ่นนั่งบนคานไม่น้อยกว่า 50 มม. หรือตามมาตรฐานผู้ผลิต
- แผ่นพื้นสำเร็จรูปที่ยาวตั้งแต่ 3.00 เมตรขึ้นไป ต้องมีเหล็กเชื่อมข้าง (Shear Key)
  เพื่อยึดประสานระหว่างแผ่น
- การติดตั้งค้ำยันชั่วคราว: ความยาวแผ่น 1.00-3.00 ม. ค้ำยัน 1 จุดที่กึ่งกลาง, ความยาวตั้งแต่
    3.00 ม. ขึ้นไป ค้ำยัน 2 จุดที่ระยะ 1/3 ของความยาวแผ่น และต้องค้ำยันตรงกันทั้งชั้นบนและล่าง
- กรณีจำเป็นต้องตัดแผ่นพื้น ให้ใช้เครื่องตัดไฟเบอร์หรือใบตัดคอนกรีตเท่านั้น ห้ามใช้ค้อนทุบหรือสกัดเด็ดขาด
- ทำความสะอาดผิวหน้า รดน้ำให้ชุ่ม วางเหล็กตะแกรงเสริมแรง แล้วเทคอนกรีตทับหน้าหนา 50
  มม. ให้เต็มร่องรอยต่อ บ่มน้ำต่อเนื่องไม่น้อยกว่า 3 วัน และคงค้ำยันไว้อย่างน้อย 7
  วัน
