id: CONCRETE_FORMING_ASA
name: งานไม้แบบและแบบหล่อคอนกรีต (Concrete Forming - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐานสากล
category: concrete_forming
masterformat: 03 11 00 - Concrete Forming
warranty_years: 1
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 03 11 00
  tis: มอก. 178-2549 (ไม้อัดสำหรับงานทั่วไปและงานแบบหล่อ)
  dpt: มาตรฐานสำหรับอาคารคอนกรีตเสริมเหล็ก วสท. 1014-46
general_properties:
- วัสดุทำแบบหล่อสามารถใช้ไม้กระดาน ไม้อัด หรือเหล็ก ที่มีความแข็งแรงทนทาน ผิวเรียบ
  ไม่โก่งงอ บิดเบี้ยว หรือชำรุด
- การทำแบบหล่อต้องได้ขนาด สัดส่วน และตำแหน่งถูกต้องตามแบบรูป เมื่อคอนกรีตแข็งตัวแล้วต้องได้ผิวและมิติที่ตรงตามกำหนด
- ระบบค้ำยันต้องใช้วัสดุที่ได้มาตรฐาน มีการคำนวณกำลังรับน้ำหนักบรรทุกปลอดภัยตามหลักวิศวกรรมโครงสร้าง
  โดยวัสดุที่ใช้ต่อค้ำยันไม้ต้องยาวไม่น้อยกว่า 1.00 เมตร
- สมมติฐานการคำนวณแบบหล่อต้องครอบคลุมน้ำหนักบรรทุกคงที่ น้ำหนักบรรทุกจร อัตราการเท
  ความสูงที่ปล่อยคอนกรีต แรงสั่นสะเทือน และแรงดันฐานของคอนกรีตสด
surface_preparation:
- ตรวจสอบแนวผัง ระดับ และแนวดิ่งของแบบหล่อให้ถูกต้องแม่นยำ พร้อมตั้งระดับค้ำยันชดเชยการทรุดตัวหรือการแอ่นตัวของโครงสร้าง
- ทำความสะอาดภายในแบบหล่อ ขจัดเศษผง ขี้เลื่อย ขยะ และสิ่งแปลกปลอมออกให้หมดก่อนเริ่มการเทคอนกรีต
- ในกรณีที่ไม่สามารถเข้าถึงก้นแบบจากภายในได้ ต้องจัดให้มีช่องเปิด (Cleanout) สำหรับทำความสะอาดที่ก้นแบบ
- ทาน้ำยาเคลือบผิวแบบหล่อเพื่อป้องกันคอนกรีตติดแบบ โดยต้องไม่ทำลายผิวหน้าคอนกรีตหรือขัดขวางการยึดเกาะของงานฉาบแต่ง
- ตรวจสอบรอยต่อแบบหล่อให้แน่นสนิท ป้องกันไม่ให้น้ำปูนรั่วไหลออกมาขณะเทและจี้คอนกรีต
application_system:
- ประกอบและติดตั้งแบบหล่อให้มั่นคงแข็งแรง มีการยึดโยงแนวทแยง (Diagonal Bracing) ทั้งในระนาบดิ่งและระนาบราบเพื่อป้องกันการโก่งตัว
- ห้ามใช้การต่อแบบทาบมากกว่า 3 จุดสลับกันสำหรับค้ำยันใต้แผ่นพื้น และห้ามต่อค้ำยันเกินกว่าหนึ่งแห่งเว้นแต่จะมีการยึดทแยงที่จุดต่อทุกแห่ง
- จัดให้มีทางเดินเฉพาะสำหรับคนงานและอุปกรณ์ ไม่วางหรือเหยียบย่ำบนเหล็กเสริมโดยตรง
  และห้ามกองวัสดุหนักบนแบบหล่อเกินพิกัด
- ระหว่างการเทคอนกรีต ต้องจัดให้มีช่างเฝ้าสังเกตการณ์การเคลื่อนตัวหรือการทรุดตัวของแบบหล่อตลอดเวลา
  หากพบการโก่งตัวผิดรูปต้องหยุดเทและแก้ไขทันที
- เกณฑ์ระยะเวลาการคงค้ำยันและถอดแบบหล่อ: ผนังและเสาไม่น้อยกว่า 48 ชั่วโมง, ค้ำยันใต้แผ่นพื้นและคานไม่น้อยกว่า
    21 วัน (กรณีคอนกรีตธรรมดา)
- ทันทีที่ถอดแบบ ต้องตรวจสอบคุณภาพผิวคอนกรีต หากพบโพรง รูพรุน หรือรอยร้าว ต้องรีบแจ้งผู้ควบคุมงานเพื่ออนุมัติวิธีการซ่อมแซมทันที
  ห้ามปะซ่อมโดยพลการ
