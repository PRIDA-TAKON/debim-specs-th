id: THERMAL_PROTECTION_ASA
name: งานป้องกันความร้อนและฉนวนกันความร้อน (Thermal Protection - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: thermal_insulation
masterformat: 07 20 00 - Thermal Protection
warranty_years: 5
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 07 20 00
  tis: มอก. 486-2527 (ฉนวนใยแก้ว), มอก. 487-2526 (การทดสอบฉนวนกันความร้อน)
  dpt: มาตรฐาน ASTM C665 (Mineral-Fiber Blanket Thermal Insulation)
general_properties:
- แผ่นฟอยล์สะท้อนความร้อนใต้แปหลังคา ชนิดทนต่อการฉีกขาด หนาไม่ต่ำกว่า 145 ไมครอน สามารถสะท้อนความร้อนได้ไม่น้อยกว่า
  95% พร้อมเทปอลูมิเนียมปิดรอยต่อ
- ฉนวนใยแก้ว (Fiberglass Insulation) หนา 75 มม. (3 นิ้ว) หุ้มด้วยอลูมิเนียมฟอยล์รอบด้านทั้ง
  6 ด้าน ป้องกันความชื้นและการหลุดร่วงของเส้นใย
- แผ่นยิบซั่มบอร์ดชนิดบุฟอยล์สะท้อนความร้อนด้านหลัง สำหรับติดตั้งใต้ฝ้าเพดานชั้นบนสุด
- วัสดุฉนวนต้องไม่ลามไฟ ปราศจากสารพิษหรือไอระเหยที่เป็นอันตรายต่อสุขภาพ
surface_preparation:
- ตรวจสอบโครงสร้างแป จันทัน หรือโครงฝ้าเพดานให้อยู่ในระดับและแนวที่ถูกต้อง มั่นคงแข็งแรง
- ประสานงานกับงานระบบท่อร้อยสายไฟ ท่อน้ำยาแอร์ และตำแหน่งโคมไฟใต้หลังคาให้แล้วเสร็จก่อนติดตั้งฉนวน
- จัดทำ Shop Drawing แสดงการจัดวางแผ่นฉนวน จุดยึด และระยะเหลื่อมซ้อนเสนอขออนุมัติ
application_system:
- การติดตั้งฟอยล์สะท้อนความร้อนใต้แป: ขึงตึงเหนือจันทันใต้แปหลังคากระเบื้องคอนกรีต
    เหลื่อมซ้อนทับกันไม่น้อยกว่า 100 มม. ติดเทปอลูมิเนียมแนบสนิทตลอดแนว
- การติดตั้งฉนวนใยแก้วใต้หลังคา ค.ส.ล.: ยึดแผ่นฉนวนหนา 75 มม. ด้วยตะปูเกลียวและพุกพลาสติกระยะ
    600x600 มม. แล้วขึงลวดสแตนเลสพันหัวตะปูเป็นรูปกากบาทเพื่อพยุงฉนวนให้แนบสนิท
- การติดตั้งบนฝ้าเพดาน: ปูฉนวนใยแก้วหนา 75 มม. หุ้มฟอยล์ 6 ด้าน บนโครงเคร่าฝ้าเพดาน
    ปูแผ่นชนแผ่นให้ชิดสนิท ห้ามมีช่องว่าง
- เก็บริมและทำความสะอาดเศษฉนวน ป้องกันไม่ให้แผ่นฉนวนฉีกขาด ชื้น หรือเปื้อนตลอดระยะเวลาก่อสร้าง
