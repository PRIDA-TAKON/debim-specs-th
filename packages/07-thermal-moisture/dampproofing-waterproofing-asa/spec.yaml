id: DAMPPROOFING_AND_WATERPROOFING_ASA
name: งานป้องกันความชื้นและการกันซึม (Dampproofing and Waterproofing - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตระบบกันซึมมาตรฐานสากล
category: thermal_moisture_waterproofing
masterformat: 07 10 00 - Dampproofing and Waterproofing
warranty_years: 5
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 07 10 00
  tis: มอก. 15 เล่ม 1-2547 (ปูนซีเมนต์ปอร์ตแลนด์)
  dpt: มาตรฐาน ASTM D412 (Tensile Properties), ASTM C836 (Cold Liquid-Applied Waterproofing
    Membrane)
general_properties:
- แผ่นกันซึมชนิดมีเกล็ดหิน หนาไม่น้อยกว่า 2.5 มม. สำหรับพื้นชั้นล่างติดดิน ห้องใต้ดิน
  และถังเก็บน้ำ ค.ส.ล. ใต้ดิน
- ซีเมนต์พิเศษสำหรับงานกันซึม (Waterproof Cementitious Mortar) ชนิดไม่เป็นอันตรายต่อร่างกาย
  สำหรับสระว่ายน้ำ ถังน้ำดื่ม และผนังห้องใต้ดิน
- วัสดุทากันซึมชนิดอะคริลิกโพลิเมอร์เสริมใยไฟเบอร์ (Acrylic Polymer with Fiber) หนาไม่น้อยกว่า
  1.0 มม. สีเขียว สำหรับดาดฟ้าและรางน้ำ ค.ส.ล.
- วัสดุยาแนวรอยต่อขยายตัว (Expansion Joint Sealant) ชนิดทนรังสี UV กันน้ำ และทาสีทับได้
surface_preparation:
- ทำความสะอาดพื้นผิวคอนกรีตให้ปราศจากฝุ่น ผง คราบไขมัน น้ำมัน เศษปูน และสิ่งสกปรก
- ตกแต่งผิวคอนกรีตให้เรียบ ปราศจากโพรงหรือรูพรุน ซ่อมแซมรอยแตกร้าวด้วยมอร์ต้ากำลังสูง
- ทำบัวลบมุมเอียง (Chamfer) ขนาด 50x50 มม. ตลอดแนวรอยต่อระหว่างพื้นและผนังก่อนลงระบบกันซึม
- ตรวจสอบตำแหน่ง Sleeve ท่อระบายน้ำ และอุปกรณ์ฝังยึดให้ติดตั้งแน่นหนาถูกต้องก่อนเริ่มงาน
application_system:
- ทาน้ำยาหรือติดตั้งระบบกันซึมตามขั้นตอนของผู้ผลิตอย่างเคร่งครัด โดยต้องทาตลบขึ้นผนังสูงไม่น้อยกว่า
  150 มม.
- สำหรับหลังคาดาดฟ้า ค.ส.ล. ให้ทากันซึมอะคริลิกโพลิเมอร์เสริมไฟเบอร์ แล้วเทคอนกรีตทับหน้า
  (Topping) หนาไม่น้อยกว่า 30 มม. เสริมเหล็กกันแตก พร้อมเว้นร่อง Expansion Joint ทุกระยะไม่เกิน
  3.00x3.00 ม.
- พื้นห้องน้ำและระเบียง ให้ทาซีเมนต์กันซึมก่อนปูกระเบื้องด้วยกาวซีเมนต์
- การทดสอบการรั่วซึม: ต้องทำการทดสอบโดยการขังน้ำ (Flood Test) ลึกไม่น้อยกว่า 50 มม.
    เป็นเวลาไม่น้อยกว่า 3 วัน (72 ชั่วโมง) ก่อนทำงานตกแต่งชั้นถัดไป หากพบการรั่วซึมต้องซ่อมแซมและทดสอบใหม่จนผ่าน
