id: ROOF_TILES_ASA
name: งานหลังคากระเบื้อง (Roof Tiles - ASA Standard)
manufacturer: มาตรฐานสมาคมสถาปนิกสยามฯ (ASA) และผู้ผลิตที่ได้รับมาตรฐาน มอก.
category: roofing_tiles
masterformat: 07 32 00 - Roof Tiles
warranty_years: 2
standards:
  asa: มาตรฐานรายการประกอบแบบก่อสร้าง สมาคมสถาปนิกสยามฯ 2552 หมวด 07 32 00
  tis: มอก. 535-2556 (กระเบื้องคอนกรีตมุงหลังคา), มอก. 2619-2556 (แปหลังคาเหล็ก)
  dpt: มาตรฐาน มยผ. 1106-52
general_properties:
- กระเบื้องคอนกรีตมุงหลังคา คุณภาพมาตรฐาน มอก. 535 สีและรุ่นตามระบุในแบบรูป ผิวเรียบ
  แกร่ง สีสม่ำเสมอ ไม่แอ่นหรือบิดเบี้ยว
- แปสำเร็จรูปชุบสังกะสี ความหนาไม่น้อยกว่า 0.70 มม. ทนต่อการกัดกร่อน
- ระบบครอบหลังคาแบบแห้ง (Dry Tech System) พร้อมแผ่นปิดรอยต่อกันรั่วซึม แผ่นปิดเชิงชาย
  และแผ่นรองใต้ครอบ
- ตะปูเกลียวยึดกระเบื้องเข้ากับแป ชนิดเคลือบกันสนิม พร้อมแหวนสแตนเลสและปะเก็นยาง EPDM
  รองกันรั่วซึม
- ไม้เชิงชายสังเคราะห์ ขนาด (17x150) + (17x150) มม. ขอบบัวผิวเรียบ ทาสีอะคริลิกชนิดภายนอก
- รางน้ำฝนสำเร็จรูปอลูมิเนียมเคลือบสีอบความร้อน พร้อมท่อระบายน้ำฝนและอุปกรณ์ครบชุด
surface_preparation:
- ตรวจสอบระดับ ความลาดเอียง (Slope) และระยะห่างของจันทันและแปเหล็กให้ได้ตามพิกัดของผู้ผลิตกระเบื้อง
- ตรวจสอบทิศทางลมและฝน เพื่อกำหนดแนวทิศทางการวางซ้อนทับของกระเบื้องไม่ให้หันเข้าหาทิศทางลมฝนหลัก
- ติดตั้งไม้เชิงชาย แผ่นปิดเชิงชาย และรางน้ำฝนสำเร็จรูปให้ได้แนวตรงและได้ระดับความลาดเอียงระบายน้ำ
application_system:
- วางมุงกระเบื้องหลังคาจากชายคาล่างขึ้นสู่สันหลังคา และมุงสวนทิศทางลมฝน โดยมีระยะซ้อนทับตามมุมลาดเอียงของหลังคา
- ยึดกระเบื้องด้วยตะปูเกลียวตามตำแหน่งที่ผู้ผลิตกำหนดอย่างมั่นคง ขันแน่นพอดีไม่ให้แผ่นกระเบื้องแตกร้าว
- การตัดแต่งเศษกระเบื้องบริเวณตะเข้สัน ตะเข้ราง ต้องตัดด้วยเครื่องตัดคมพิเศษ และยึดแผ่นเศษให้มั่นคง
- ติดตั้งครอบสันหลังคาและครอบตะเข้สันด้วยระบบ Dry Tech ติดแผ่นกันรั่วซึมแนบสนิทตามลอนกระเบื้อง
  ห้ามใช้ปูนปั้นโป๊วครอบสันหลังคาเด็ดขาด
- การทดสอบการรั่วซึม: ฉีดน้ำรดทั่วทั้งผืนหลังคาด้วยแรงดันน้ำและระยะเวลาที่เหมาะสม
    ตรวจสอบใต้หลังคาต้องไม่มีน้ำซึมหยดเด็ดขาด
